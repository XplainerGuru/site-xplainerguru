<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Article | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { background: #f8fafc; font-family: 'Manrope', sans-serif; margin: 0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh;}
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px 80px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #2563eb; text-decoration: none; font-weight: 700; margin-bottom: 25px; font-size: 14px; transition: 0.2s;}
        .back-btn:hover { color: #1d4ed8; transform: translateX(-5px); }

        .article-header { text-align: center; margin-bottom: 30px; }
        .article-title { font-family: 'Poppins'; color: #0f172a; font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0 0 15px; line-height: 1.3; }
        
        .article-meta { color: #64748b; font-size: 14px; font-weight: 600; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .article-meta span { display: flex; align-items: center; gap: 5px; }
        
        .article-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #e2e8f0; }
        .article-content { font-size: 17px; color: #334155; line-height: 1.8; white-space: pre-wrap; }
        
        .loader { text-align: center; padding: 100px 20px; color: #94a3b8; font-family: 'Poppins'; }
        .error-state { text-align: center; padding: 50px; background: #fff; border-radius: 12px; border: 1px dashed #ef4444; color: #ef4444; font-family: 'Poppins'; }
    </style>
</head>
<body>

    <div class="container">
        <a href="articles.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Articles</a>
        <div id="article-container"><div class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Loading Article...</div></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>

    <script>
        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const container = document.getElementById('article-container');

            if(!articleId) { container.innerHTML = `<div class="error-state"><i class="fa-solid fa-circle-exclamation fa-2x"></i><br><br>Invalid Article ID.</div>`; return; }

            try {
                const doc = await db.collection('articles').doc(articleId).get();
                const data = doc.exists ? doc.data() : {};
                if(!doc.exists || !(data.deleteStatus === 'Active' || !data.isDeleted)) {
                    container.innerHTML = `<div class="error-state"><i class="fa-solid fa-file-circle-xmark fa-2x"></i><br><br>This article has been removed.</div>`; return;
                }

                const dateStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Recently Published';
                const contentHtml = data.content ? data.content.replace(/\n/g, '<br>') : 'No content available.';

                document.title = `${data.title} | Xplainer Guru`;

                // 🔒 VIEWS REMOVED FROM UI
                container.innerHTML = `
                    <div class="article-header">
                        <h1 class="article-title">${data.title}</h1>
                        <div class="article-meta">
                            <span style="color:#2563eb;"><i class="fa-solid fa-pen-nib"></i> ${data.authorName || 'Xplainer Guru'}</span>
                            <span><i class="fa-solid fa-calendar"></i> ${dateStr}</span>
                        </div>
                    </div>
                    <img src="${data.cover || 'logo.png'}" class="article-cover" onerror="this.style.display='none'">
                    <div class="article-content">${contentHtml}</div>
                `;

            } catch(e) { container.innerHTML = `<div class="error-state">Failed to load the article.</div>`; }
        }

        loadArticle();
    </script>
</body>
</html>
