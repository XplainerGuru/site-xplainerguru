<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Dashboard | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        .u-card { background: #0f172a; color: #fff; padding: 40px 25px; border-radius: 25px; display: flex; align-items: center; gap: 25px; }
        .p-box { width: 100px; height: 100px; position: relative; flex-shrink: 0; cursor: pointer; }
        .p-box img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #000080; object-fit: cover; }
        .logout-btn { background: #ef4444; color: #fff; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        @media (max-width: 600px) { .u-card { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <script src="content.js"></script><script src="master.js"></script>
    <div class="container">
        <div class="u-card">
            <div class="p-box" onclick="document.getElementById('file-in').click()">
                <img id="user-dp" src=""><span style="position:absolute; bottom:0; right:0; background:#2563eb; font-size:10px; padding:4px 8px; border-radius:5px; font-weight:800;">EDIT</span>
                <input type="file" id="file-in" hidden accept="image/*" onchange="updateDP(event)">
            </div>
            <div>
                <h1 id="user-name" style="margin:0; font-family:'Poppins';">User!</h1>
                <p id="user-email" style="opacity:0.7; font-size:14px;"></p>
                <button class="logout-btn" onclick="logoutUser()">Logout Now</button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const u = JSON.parse(localStorage.getItem('xg_user'));
            if(!u) window.location.href="login.html";
            document.getElementById('user-name').innerText = `Hi, ${u.name}!`;
            document.getElementById('user-email').innerText = u.email;
            document.getElementById('user-dp').src = u.pic || `https://ui-avatars.com/api/?name=${u.name}&background=000080&color=fff`;
        });
        function updateDP(e) {
            const r = new FileReader(); r.onload = () => {
                const u = JSON.parse(localStorage.getItem('xg_user')); u.pic = r.result;
                localStorage.setItem('xg_user', JSON.stringify(u)); window.location.reload(); 
            }; r.readAsDataURL(e.target.files[0]);
        }
    </script>
</body>
</html>
