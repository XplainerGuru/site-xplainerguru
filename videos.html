<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Classes | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 font-['Manrope'] m-0 pt-[100px] flex flex-col min-h-screen text-slate-800">

    <div class="max-w-[1100px] mx-auto px-5 pb-[50px] flex-1 w-full box-border">
        
        <div class="mb-[30px] text-center sm:text-left">
            <h1 class="font-['Poppins'] text-slate-900 m-0 mb-2.5 text-3xl"><i class="fa-brands fa-youtube text-red-500"></i> Video Classes</h1>
            <p class="text-slate-500 m-0 text-[14px]">Master your concepts with high-quality video explanations.</p>
        </div>

        <div class="hidden bg-slate-900 p-5 rounded-[20px] mb-10 shadow-2xl transition-all" id="playerView">
            <div class="text-white font-['Poppins'] mb-[15px] text-lg flex items-center gap-2.5">
                <i class="fa-solid fa-circle-play text-red-500"></i> <span id="playingTitle">Lecture</span>
            </div>
            <div class="relative pb-[56.25%] h-0 rounded-xl overflow-hidden bg-black" id="mainVideoBox">
                </div>
        </div>

        <div class="relative w-full max-w-[600px] mx-auto mb-[30px]">
            <i class="fa-solid fa-magnifying-glass absolute left-[18px] top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
            <input type="text" id="video-search" class="w-full p-[14px_15px_14px_45px] rounded-full border border-slate-300 outline-none font-['Manrope'] shadow-[0_4px_15px_rgba(0,0,0,0.05)] text-[15px] transition duration-200 box-border focus:border-blue-600 focus:shadow-[0_4px_20px_rgba(37,99,235,0.15)] bg-white" onkeyup="liveSearchVideos()" placeholder="Search by subject, or video title...">
        </div>

        <div id="contentGrid" class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-5">
            <div class="col-span-full text-center p-[50px] text-slate-400 font-['Poppins']">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-4"></i><br>Loading classes...
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/chatbot.js"></script>

    <script>
        const videoDb = firebase.firestore(); 
        const grid = document.getElementById('contentGrid');

        function extractYTId(url) {
            if(!url) return "";
            let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
            return (match && match[1]) ? match[1] : url;
        }

        function shareVideo(ytId, title) {
            const shareUrl = window.location.origin + window.location.pathname + '?v=' + ytId;
            if (navigator.share) {
                navigator.share({ title: title, url: shareUrl }).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => alert('Link copied to clipboard!')).catch(console.error);
            }
        }

        async function loadVideos() {
            videoDb.collection("videos").onSnapshot(snap => {
                let vData = [];
                snap.forEach(doc => { 
                    let d = doc.data(); d.id = doc.id;
                    if(d.deleteStatus === 'Active' || !d.isDeleted) vData.push(d); 
                });

                if(vData.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center p-[60px_20px] bg-white rounded-2xl border-2 border-dashed border-slate-300">
                            <i class="fa-solid fa-video-slash text-[40px] text-slate-400 mb-[15px]"></i>
                            <h4 class="m-0 mb-2 text-slate-900 font-['Poppins'] text-[18px]">No Videos Found</h4>
                            <p class="m-0 text-slate-500 text-[14px]">Classes will be published here soon.</p>
                        </div>`;
                    return;
                }

                const groupedVideos = vData.reduce((acc, item) => {
                    const subject = item.subject || 'General';
                    if (!acc[subject]) acc[subject] = [];
                    acc[subject].push(item);
                    return acc;
                }, {});

                let html = '';
                for (const [subject, videoArray] of Object.entries(groupedVideos)) {
 videoArray.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    html += `<div class="col-span-full mt-8 mb-2"><h2 class="font-['Poppins'] text-slate-900 text-xl border-b-2 border-slate-200 pb-2.5 m-0">${subject}</h2></div>`;
                    videoArray.forEach(item => {
                        const url = item.url || item.link || item.file_url; 
                        const ytId = extractYTId(url);
                        const safeTitle = item.title ? item.title.replace(/'/g, "\\'") : 'Untitled Video';
                        const dateStr = item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recently Added';

                        html += `
                        <div class="video-card bg-white rounded-2xl p-6 border border-slate-200 shadow-[0_4px_15px_rgba(0,0,0,0.02)] flex flex-col transition duration-300 hover:-translate-y-1 hover:shadow-lg hover:border-blue-300">
                            <span class="bg-indigo-50 text-indigo-600 text-[10px] font-extrabold px-2.5 py-1 rounded self-start uppercase tracking-wider">${subject}</span>
                            
                            <div class="mt-[15px] rounded-xl overflow-hidden relative pb-[56.25%] bg-black group">
                                <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="absolute w-full h-full object-cover opacity-90 transition duration-300 group-hover:opacity-100 group-hover:scale-105" onerror="this.src='logo.png'">
                                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                    <i class="fa-solid fa-circle-play text-white/80 text-4xl group-hover:text-red-500 transition duration-300 shadow-sm drop-shadow-md"></i>
                                </div>
                            </div>
                            
                            <h3 class="m-0 mt-[15px] mb-1.5 font-['Poppins'] text-slate-900 text-[16px] leading-snug line-clamp-2">${item.title}</h3>
                            
                            <div class="flex gap-2 mt-auto">
                                <button onclick="play('${ytId}', '${safeTitle}', '${item.id}')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white border-none p-3 rounded-lg font-bold cursor-pointer text-center no-underline font-['Manrope'] transition duration-200"><i class="fa-solid fa-play"></i> Watch Now</button>
                                <button onclick="shareVideo('${ytId}', '${safeTitle}')" class="bg-slate-100 text-slate-600 p-3 rounded-lg border-none hover:bg-slate-200 transition cursor-pointer" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
                                <a href="https://www.youtube.com/watch?v=${ytId}" target="_blank" class="bg-red-600 text-white p-3 rounded-lg border-none hover:bg-red-700 transition cursor-pointer flex items-center justify-center" title="Watch on YouTube"><i class="fa-brands fa-youtube"></i></a>
                            </div>
                        </div>`;
                    });
                }
                grid.innerHTML = html;
            }, e => {
                console.error(e); 
                grid.innerHTML = `<div class="col-span-full text-center p-5 text-red-500 font-bold bg-red-50 rounded-xl border border-red-200">Error loading videos. Retrying...</div>`; 
            });
        }

        // Auto-play if link shared
        function checkAutoPlay() {
            const params = new URLSearchParams(window.location.search);
            const vId = params.get('v');
            if (!vId) return;
            
            videoDb.collection("videos").where("url", ">=", "https://www.youtube.com/watch?v=" + vId).limit(1).get().then(snap => {
                if(!snap.empty) {
                    const d = snap.docs[0].data();
                    play(vId, d.title, snap.docs[0].id);
                } else {
                    // Fallback for direct IDs
                    play(vId, "Shared Video", null);
                }
            });
        }

        function play(id, title, docId) {
            const view = document.getElementById('playerView');
            const videoBox = document.getElementById('mainVideoBox');
            document.getElementById('playingTitle').innerText = title;
            view.style.display = 'block';
            
            const origin = window.location.origin;
            videoBox.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(origin)}" 
                    class="absolute top-0 left-0 w-full h-full border-none rounded-xl" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>`;
            view.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            if(docId) videoDb.collection("videos").doc(docId).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
        }

        // LIVE SEARCH LOGIC
        function liveSearchVideos() {
            let filter = document.getElementById('video-search').value.toLowerCase();
            let cards = document.querySelectorAll('.video-card');

            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                if (text.includes(filter)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadVideos();
            checkAutoPlay();
        });
    </script>
</body>
</html>
