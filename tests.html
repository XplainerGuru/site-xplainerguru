<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests | Xplainer Guru</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 font-['Manrope'] m-0">

    <div id="loader-ui" class="flex flex-col items-center justify-center min-h-[60vh] text-slate-400 font-['Poppins']">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x text-blue-600 mb-[15px]"></i>
        <h3 class="m-0 text-slate-900 text-xl">Loading Test Engine...</h3>
    </div>

    <div id="main-ui" class="max-w-[1200px] mx-auto my-10 px-5 min-h-[80vh] hidden w-full box-border">

        <div class="text-center mb-[30px]">
            <h1 class="font-['Poppins'] text-slate-900 mb-2.5 text-2xl sm:text-3xl"><i class="fa-solid fa-laptop-code text-blue-600"></i> Mock Test Portal</h1>
            <p class="text-slate-500 text-[15px] m-0">Practice computer-based tests, track your time, and analyze your performance.</p>
        </div>

        <div class="relative w-full max-w-[600px] mx-auto mb-10">
            <i class="fa-solid fa-magnifying-glass absolute left-[18px] top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
            <input type="text" id="test-search" class="w-full p-[15px_15px_15px_45px] rounded-full border border-slate-300 outline-none font-['Manrope'] shadow-[0_4px_15px_rgba(0,0,0,0.05)] text-[15px] transition duration-200 box-border focus:border-blue-600 focus:shadow-[0_4px_20px_rgba(37,99,235,0.15)] bg-white" onkeyup="liveSearchTests()" placeholder="Search by subject, chapter, or test name...">
        </div>

        <div class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-5" id="test-list-container">
            </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>
    
    <script>
        // 1. PUBLIC VISIBILITY LOGIC & FETCH TRIGGER
        document.addEventListener('DOMContentLoaded', () => {
            // Master.js ko thoda time dene ke baad UI dikhao
            setTimeout(() => {
                document.getElementById('loader-ui').style.display = 'none';
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('main-ui').style.display = 'block';

                // 🟢 Jaise hi page load ho, Firebase se tests mangwao!
                fetchLiveTests();
            }, 800);
        });

        // 2. 🚀 FIREBASE REAL-TIME FETCH ENGINE WITH GROUPING
        async function fetchLiveTests() {
            const container = document.getElementById('test-list-container');
            container.innerHTML = '<p class="text-center text-slate-500 col-span-full"><i class="fa-solid fa-spinner fa-spin"></i> Fetching live tests from server...</p>';

            try {
                // 'mock_tests' collection se data nikalna
                const snapshot = await firebase.firestore().collection('mock_tests').get();

                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-center text-slate-500 col-span-full font-semibold"><i class="fa-solid fa-ghost text-2xl mb-2"></i><br>No tests available at the moment. Please check back later!</p>';
                    return;
                }

                let tData = [];
                snapshot.forEach(doc => { tData.push({...doc.data(), id: doc.id}); });

                // 🟢 Group By Subject
                const groupedTests = tData.reduce((acc, item) => {
                    const subject = item.subject || 'General';
                    if (!acc[subject]) acc[subject] = [];
                    acc[subject].push(item);
                    return acc;
                }, {});

                let html = '';
                // 🟢 Generate Subject-Wise Sections dynamically
                for (const [subject, testArray] of Object.entries(groupedTests)) {
                    // Sort tests in this subject by newest first
                    testArray.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    
                    html += `<div class="col-span-full mt-10 mb-4 border-b-2 border-slate-200 pb-2"><h2 class="font-['Poppins'] text-slate-900 text-xl m-0">${subject}</h2></div>`;

                    testArray.forEach(test => {
                        const durationText = test.duration ? `${test.duration} Mins` : `No Limit`;
                        const modeText = test.duration ? `${test.qCount || 0} Qs` : `Practice`;
                        const safeSearchTitle = test.title ? test.title.toLowerCase().replace(/"/g, '&quot;') : '';
                        
                        html += `
                        <div class="search-item bg-white rounded-[16px] p-[25px] border border-slate-200 shadow-[0_4px_15px_rgba(0,0,0,0.02)] flex flex-col transition duration-300 hover:-translate-y-1 hover:shadow-[0_10px_25px_rgba(0,0,0,0.05)] hover:border-blue-300" data-title="${safeSearchTitle}">
                            <span class="bg-indigo-50 text-indigo-600 text-[10px] font-extrabold px-2 py-1 rounded-[4px] self-start uppercase">${subject}</span>
                            <h3 class="m-0 mt-[15px] font-['Poppins'] text-slate-900 text-[18px] leading-tight">${test.title || 'Untitled Test'}</h3>
                            <div class="flex gap-[15px] my-2.5 mb-5 text-[13px] text-slate-500 font-semibold">
                                <span><i class="fa-regular fa-circle-question"></i> ${modeText}</span>
                                <span><i class="fa-regular fa-clock"></i> ${durationText}</span>
                            </div>
                            <button onclick="handleTestClick('${test.id}')" class="mt-auto bg-slate-900 text-white border-none p-3 rounded-lg font-bold cursor-pointer text-center no-underline font-['Manrope'] transition duration-200 block w-full hover:bg-slate-800"><i class="fa-solid fa-play"></i> Start CBT Test</button>
                        </div>`;
                    });
                }
                container.innerHTML = html;

            } catch (error) {
                console.error("Fetch Error:", error);
                container.innerHTML = '<p class="text-center text-red-500 col-span-full font-extrabold">Failed to load tests. Please check your internet connection.</p>';
            }
        }

        // 3. LIVE SEARCH LOGIC
        function liveSearchTests() {
            let input = document.getElementById('test-search').value.toLowerCase();
            let cards = document.querySelectorAll('.search-item');
            
            // Also handle subject headers dynamically
            let headers = document.querySelectorAll('.col-span-full'); 
            let visibleCount = 0;

            cards.forEach(card => {
                let title = card.getAttribute('data-title') || card.innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 4. 🔒 ACTION-LEVEL AUTH GUARD
        function handleTestClick(testId) {
            const user = firebase.auth().currentUser;
            if(!user) {
                localStorage.setItem("redirectAfterLogin", `exam.html?id=${testId}`);
                window.location.href = "login.html";
            } else {
                window.location.href = `exam.html?id=${testId}`;
            }
        }
    </script>
</body>
</html>
