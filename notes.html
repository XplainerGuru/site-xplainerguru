<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Handwritten Notes | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .container { max-width: 1000px; margin: 40px auto; padding: 0 15px; }
        .note-card { background: #fff; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .dl-btn { background: #000080; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-family:'Poppins';">Study Notes</h1>
        <p style="color:#64748b; margin-bottom:40px;">Get premium notes for your exam preparation.</p>
        <div class="note-card">
            <h3 style="font-family:'Poppins';">Trade to Territory</h3>
            <p style="font-size:14px; color:#64748b;">Complete Chapter 1 notes.</p>
            <button class="dl-btn" onclick="checkAuth('Download PDF')">Download PDF</button>
        </div>
    </div>
    <script src="content.js"></script>
    <script src="master.js"></script>
</body>
</html>
