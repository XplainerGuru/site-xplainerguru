<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Premium Notes | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>

    <script src="master.js" defer></script>
    
    <style>
        body { background: #f8fafc; margin: 0; padding-top: 72px; font-family: 'Manrope', sans-serif; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 15px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h1 { font-family: 'Poppins'; color: #0f172a; font-size: 2rem; }

        .notes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .note-card { background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #e2e8f0; transition: 0.3s; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .note-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,128,0.06); }
        .note-icon { width: 40px; height: 40px; background: #eff6ff; color: #2563eb; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
        .note-title { font-family: 'Poppins'; font-size: 13px; color: #0f172a; margin-bottom: 10px; line-height: 1.4; flex-grow: 1; }
        
        .download-btn { 
            width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: none;
            background: #000080; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Manrope'; font-size: 12px;
        }
        .download-btn:hover { background: #2563eb; }

        /* --- DOCUMENT VIEWER MODAL --- */
        #pdf-viewer-modal {
            display: none; position: fixed; inset: 0; background: #f1f5f9;
            z-index: 99990; flex-direction: column; width: 100%; height: 100vh;
        }
        .pdf-header {
            background: #0f172a; color: #fff; padding: 15px 20px; display: flex;
            justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 10;
        }
        .pdf-header h3 { margin: 0; font-family: 'Poppins'; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .close-pdf-btn { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        
        #pdf-container { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        
        /* IMAGE & CANVAS STYLES */
        #pdf-container canvas, #pdf-container img { 
            max-width: 100%; width: 800px; margin: 0 auto 15px auto; display: block; 
            border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); 
        }

        /* --- STRICT AUTH POPUP --- */
        #auth-modal {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            z-index: 99999; backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #fff; padding: 30px 20px; border-radius: 20px; max-width: 350px; width: 100%;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: popIn 0.4s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .modal-content h2 { font-family: 'Poppins'; color: #0f172a; margin-bottom: 10px; font-size: 1.5rem; }
        .modal-content p { color: #64748b; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn { display: block; width: 100%; padding: 12px; border-radius: 10px; font-weight: 800; text-decoration: none; margin-bottom: 10px; font-size: 13px; transition: 0.3s; }
        .btn-login { background: #2563eb; color: #fff; }
        .btn-signup { background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
        .btn-cancel { background: transparent; color: #ef4444; border: none; cursor: pointer; font-weight: 700; margin-top: 10px; text-decoration: underline; font-family: 'Manrope'; }

        @media (max-width: 600px) {
            .notes-grid { gap: 10px; }
            .note-card { padding: 12px; }
            .note-title { font-size: 12px; }
            .download-btn { padding: 8px; font-size: 11px; }
            #pdf-container { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="pdf-viewer-modal">
        <div class="pdf-header">
            <h3 id="pdf-title">Loading Document...</h3>
            <button class="close-pdf-btn" onclick="closePdfViewer()"><i class="fa-solid fa-xmark"></i> Close</button>
        </div>
        <div id="pdf-container"></div>
    </div>

    <div id="auth-modal">
        <div class="modal-content">
            <div style="font-size: 35px; color: #2563eb; margin-bottom: 15px;"><i class="fa-solid fa-lock"></i></div>
            <h2>Unlock Full Access</h2>
            <p>This document is part of our premium study library. Please log in or create a free account to read the complete notes.</p>
            <a href="login.html" class="modal-btn btn-login">Log In to Continue</a>
            <a href="login.html" class="modal-btn btn-signup">Create Account</a>
            <button class="btn-cancel" onclick="cancelAndClose()">Go Back</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Premium Study Notes</h1>
            <p>Access high-quality PDFs and Board Notes curated by our expert team.</p>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
    </div>

    <script src="content.js"></script>
    <script>
        let pdfTimer; 

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('notesGrid');
            if (typeof studyNotes !== 'undefined') {
                studyNotes.forEach(note => {
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    
                    // Smart Icon logic: If image, show image icon, else show PDF icon
                    const isImg = note.file.match(/\.(jpeg|jpg|gif|png|webp)$/i);
                    const iconClass = isImg ? 'fa-image' : 'fa-file-pdf';
                    const formatText = isImg ? 'Board Image' : 'PDF';

                    card.innerHTML = `
                        <div class="note-icon"><i class="fa-solid ${iconClass}"></i></div>
                        <h3 class="note-title">${note.title}</h3>
                        <div style="font-size: 11px; color: #94a3b8;">Format: ${formatText}</div>
                        <button class="download-btn" onclick="startHook('${note.file}', '${note.title.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-eye"></i> View Notes
                        </button>
                    `;
                    grid.appendChild(card);
                });
            }
        });

        // SMART RENDER FUNCTION (Handles both PDF and Images)
        async function renderDocument(url) {
            const container = document.getElementById('pdf-container');
            
            // Check if URL ends with an image extension
            const isImage = url.match(/\.(jpeg|jpg|gif|png|webp)$/i);

            if(isImage) {
                // It's a Board Photo
                container.innerHTML = `<img src="${url}" alt="Board Notes">`;
            } else {
                // It's a PDF
                container.innerHTML = '<div style="padding: 40px; color: #64748b; font-family: Poppins;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Loading Premium Notes...</div>';
                try {
                    const pdf = await pdfjsLib.getDocument(url).promise;
                    container.innerHTML = ''; 
                    for (let num = 1; num <= pdf.numPages; num++) {
                        const page = await pdf.getPage(num);
                        const viewport = page.getViewport({ scale: 1.5 }); 
                        const canvas = document.createElement('canvas');
                        container.appendChild(canvas);
                        const ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    }
                } catch (error) {
                    container.innerHTML = '<div style="padding: 30px; color: #ef4444;"><i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>Unable to load Document. Please ensure internet is active.</div>';
                }
            }
        }

        function startHook(url, title) {
            document.getElementById('pdf-title').innerText = title;
            document.getElementById('pdf-viewer-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
            
            renderDocument(url);

            const user = localStorage.getItem('xg_user');
            if (!user) {
                clearTimeout(pdfTimer);
                pdfTimer = setTimeout(() => {
                    document.getElementById('auth-modal').style.display = 'flex';
                }, 1500); 
            }
        }

        function closePdfViewer() {
            document.getElementById('pdf-viewer-modal').style.display = 'none';
            document.getElementById('pdf-container').innerHTML = ""; 
            document.body.style.overflow = 'auto'; 
            clearTimeout(pdfTimer); 
        }

        function cancelAndClose() {
            document.getElementById('auth-modal').style.display = 'none';
            closePdfViewer(); 
        }
    </script>
</body>
</html>
