<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 font-['Manrope'] m-0 pt-[100px] flex flex-col min-h-screen text-slate-800">

    <div class="max-w-[1000px] mx-auto px-5 pb-[50px] flex-1 w-full box-border" id="main-ui">
        
        <div class="mb-5 flex justify-between items-end flex-wrap gap-4">
            <div>
                <h1 class="font-['Poppins'] text-slate-900 m-0 mb-1 text-3xl"><i class="fa-solid fa-file-pdf text-emerald-500"></i> Study Notes</h1>
                <p class="text-slate-500 m-0 text-[14px]">Download chapter-wise revision notes.</p>
            </div>
        </div>

        <div class="relative w-full mb-[30px]">
            <i class="fa-solid fa-magnifying-glass absolute left-[18px] top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
            <input type="text" id="notes-search-box" class="w-full p-[14px_15px_14px_45px] rounded-xl border border-slate-300 outline-none font-['Manrope'] shadow-[0_4px_15px_rgba(0,0,0,0.02)] text-[15px] transition duration-200 box-border bg-white focus:border-emerald-500 focus:shadow-[0_4px_20px_rgba(16,185,129,0.15)]" onkeyup="filterNotes()" placeholder="Search notes by chapter, topic, or title...">
        </div>

        <div id="contentGrid" class="grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-5">
            <div class="col-span-full text-center py-[50px] px-5 text-slate-400 font-['Poppins']">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-4"></i><br>Loading Notes...
            </div>
        </div>
        
        <div id="no-results-msg" class="hidden col-span-full text-center p-10 bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 mt-5 shadow-sm">
            <i class="fa-solid fa-folder-open text-[30px] text-slate-300 mb-2.5"></i>
            <p class="m-0 font-['Manrope'] font-medium">No notes found matching your search.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>
    <script src="js/notification.js"></script>
    <script src="js/chatbot.js"></script>

    <script>
        const grid = document.getElementById('contentGrid');

        // Let the page load immediately for everyone
        document.addEventListener('DOMContentLoaded', () => {
            loadNotes();
        });

        function shareNote(link, title) {
            const shareUrl = window.location.origin + '/download.html?file=' + encodeURIComponent(link);
            if (navigator.share) {
                navigator.share({ title: title, url: shareUrl }).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => alert('Link copied to clipboard!')).catch(console.error);
            }
        }

        function loadNotes() {
            db.collection("notes").onSnapshot(snap => {
                let nData = [];
                snap.forEach(doc => { 
                    let d = doc.data(); d.id = doc.id;
                    if(d.deleteStatus === 'Active' || !d.isDeleted) nData.push(d); 
                });

                if(nData.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center p-[60px_20px] bg-white rounded-[16px] border-2 border-dashed border-slate-300">
                            <i class="fa-solid fa-folder-open text-[40px] text-slate-400 mb-[15px]"></i>
                            <h4 class="m-0 mb-2 text-slate-900 font-['Poppins'] text-[18px]">No Notes Available</h4>
                            <p class="m-0 text-slate-500 text-[14px]">Study materials will be uploaded here soon.</p>
                        </div>`;
                    return;
                }

                // 🟢 Group Notes By Subject dynamically
                const groupedNotes = nData.reduce((acc, item) => {
                    const subject = item.subject || 'General Notes';
                    if (!acc[subject]) acc[subject] = [];
                    acc[subject].push(item);
                    return acc;
                }, {});

                let html = '';
                let globalCardCount = 0;
                
                // 🟢 Generate HTML for each subject grouping
                for (const [subject, notesArray] of Object.entries(groupedNotes)) {
                    // Sort notes in this specific subject by newest first
                    notesArray.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                    html += `<div class="col-span-full search-item" data-title="${subject.toLowerCase()}"><h2 class="font-['Poppins'] text-slate-900 mt-10 mb-4 border-b-2 border-slate-200 pb-2.5 text-[22px]">${subject}</h2></div>`;
                    
                    notesArray.forEach(item => {
                        const dateStr = item.timestamp ? new Date(item.timestamp.seconds*1000).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recently Added';
                        const safeSearchTitle = item.title ? item.title.toLowerCase().replace(/"/g, '&quot;') : '';
                        const safeLink = item.link ? item.link.replace(/'/g, "\\'") : item.file_url ? item.file_url.replace(/'/g, "\\'") : '#';
                        
                        globalCardCount++;

                        // Inject Ad between 2nd and 3rd card globally
                        if (globalCardCount === 3) {
                            html += `
                            <div class="col-span-full w-full flex justify-center my-6 min-h-[50px]">
                                <div id="container-e9b12f5418d9e679de47d1e3b3183725"></div>
                            </div>`;
                        }

                        html += `
                        <div class="note-card search-item bg-white rounded-[16px] p-[25px] border border-slate-200 shadow-[0_4px_15px_rgba(0,0,0,0.02)] flex flex-col transition duration-300 hover:-translate-y-1 hover:shadow-lg hover:border-emerald-500" data-title="${safeSearchTitle} ${subject.toLowerCase()}">
                            <span class="bg-emerald-50 text-emerald-500 text-[10px] font-extrabold px-2 py-1 rounded-[4px] self-start uppercase tracking-wider">${subject}</span>
                            <h3 class="m-0 mt-[15px] mb-[5px] font-['Poppins'] text-slate-900 text-[16px] leading-[1.4]">${item.title}</h3>
                            <div class="flex gap-2 mt-auto pt-5">
                                <button onclick="handleNoteClick('${safeLink}', '${item.id}')" class="flex-1 bg-slate-900 text-white border-none p-3 rounded-lg font-bold cursor-pointer text-center no-underline font-['Manrope'] transition duration-200 hover:bg-slate-800"><i class="fa-solid fa-lock-open"></i> View PDF</button>
                                <button onclick="shareNote('${safeLink}', '${item.title}')" class="bg-slate-100 text-emerald-600 p-3 rounded-lg border-none hover:bg-slate-200 transition cursor-pointer" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                        </div>`;
                    });
                }
                
                grid.innerHTML = html;

                // Inject script after DOM is ready
                if (globalCardCount >= 3) {
                    const adScript = document.createElement('script');
                    adScript.async = true;
                    adScript.setAttribute('data-cfasync', 'false');
                    adScript.src = "https://pl29365593.profitablecpmratenetwork.com/e9b12f5418d9e679de47d1e3b3183725/invoke.js";
                    adScript.onerror = () => console.error("Native Ad (Notes) blocked.");
                    document.body.appendChild(adScript);
                }
            }, e => { 
                console.error("Firebase error: ", e);
                grid.innerHTML = `<div class="col-span-full text-center p-5 text-red-500 font-bold bg-red-50 rounded-xl border border-red-200">Error loading notes. Retrying...</div>`; 
            });
        }

        // 🔒 ACTION-LEVEL AUTH GUARD
        function handleNoteClick(link, docId) {
            const user = firebase.auth().currentUser;
            if(!user) {
                localStorage.setItem("redirectAfterLogin", "notes.html");
                window.location.href = "login.html";
            } else {
                window.location.href = `download.html?file=${encodeURIComponent(link)}`;
                if(docId) db.collection("notes").doc(docId).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
            }
        }

        // 🟢 LIVE SEARCH FUNCTION LOGIC
        function filterNotes() {
            let input = document.getElementById('notes-search-box').value.toLowerCase();
            let items = document.querySelectorAll('.search-item');
            let visibleCount = 0;
            let noResultsMsg = document.getElementById('no-results-msg');

            items.forEach(item => {
                let title = item.getAttribute('data-title');
                if (title.includes(input)) {
                    if(item.classList.contains('note-card')) {
                        item.style.display = 'flex';
                        visibleCount++;
                    } else {
                        item.style.display = 'block'; // for subject headers
                    }
                } else {
                    item.style.display = 'none';
                }
            });

            // Show "No Results" message if everything is hidden
            if (visibleCount === 0 && items.length > 0) {
                noResultsMsg.classList.remove('hidden');
                noResultsMsg.classList.add('block');
            } else {
                noResultsMsg.classList.add('hidden');
                noResultsMsg.classList.remove('block');
            }
        }
    </script>
</body>
</html>
