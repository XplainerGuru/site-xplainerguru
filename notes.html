<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Only body and content styles */
        body { font-family: 'Manrope', sans-serif; background: #f8fafc; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 850px; margin: 40px auto 60px; padding: 0 20px; }
        .note-item { background: #fff; border-radius: 20px; padding: 30px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eef2f6; margin-bottom: 20px; }
        .btn-view { background: #2563eb; color: #fff; padding: 14px 28px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    
    <div class="container">
        <h1 style="font-family:'Poppins'; border-left: 6px solid #2563eb; padding-left: 20px; margin-bottom: 50px; color:#0f172a;">Handwritten Notes</h1>
        <div id="notes-list"></div>
    </div>

    <script src="content.js"></script>
    <script src="master.js"></script>
    <script>
        const list = document.getElementById('notes-list');
        studyNotes.forEach(n => {
            list.innerHTML += `<div class="note-item"><div><strong style="font-size:18px; color:#0f172a;">${n.title}</strong><br><small style="color:#64748b; font-weight:600;">Type: ${n.size}</small></div><a href="${n.file}" class="btn-view" target="_blank">Open Notes</a></div>`;
        });
    </script>
</body>
</html>
