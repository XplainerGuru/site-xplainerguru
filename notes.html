<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { background: #f8fafc; font-family: 'Manrope', sans-serif; margin: 0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh;}
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 50px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .page-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        .page-header h1 { font-family: 'Poppins'; color: #0f172a; margin: 0 0 5px; font-size: 2rem;}
        .page-header p { color: #64748b; margin: 0; font-size: 14px;}

        /* 🟢 NEW: LIVE SEARCH BAR CSS 🟢 */
        .search-container { position: relative; width: 100%; margin-bottom: 30px; }
        .search-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; }
        .live-search-input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; font-family: 'Manrope'; box-shadow: 0 4px 15px rgba(0,0,0,0.02); font-size: 15px; transition: 0.2s; box-sizing: border-box; background: #fff; }
        .live-search-input:focus { border-color: #10b981; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15); }

        /* CONSISTENT CARD STYLES */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .note-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .note-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); border-color: #10b981; }
        
        .note-meta { display: flex; gap: 15px; margin: 10px 0 20px; font-size: 13px; color: #64748b; font-weight: 600; }
        
        .start-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-family: 'Manrope';
            transition: 0.2s;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: auto;
        }
        .start-btn:hover { background: #1e293b; }

        .loader { text-align: center; padding: 50px; color: #94a3b8; font-family: 'Poppins'; grid-column: 1/-1;}
        
        /* Message shown when search yields no results */
        .no-search-results { grid-column: 1/-1; text-align: center; padding: 40px; background: #fff; border-radius: 12px; border: 1px dashed #cbd5e1; color: #64748b; display: none; }
    </style>
</head>
<body>

    <div class="container" id="main-ui" style="display:none;">
        <div class="page-header">
            <div>
                <h1><i class="fa-solid fa-file-pdf" style="color: #10b981;"></i> Study Notes</h1>
                <p>Download chapter-wise revision notes.</p>
            </div>
        </div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="notes-search-box" class="live-search-input" onkeyup="filterNotes()" placeholder="Search notes by chapter, topic, or title...">
        </div>

        <div id="contentGrid" class="grid">
            <div class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Loading Notes...</div>
        </div>
        
        <div id="no-results-msg" class="no-search-results">
            <i class="fa-solid fa-folder-open" style="font-size: 30px; color: #cbd5e1; margin-bottom: 10px;"></i>
            <p style="margin: 0; font-family: 'Manrope';">No notes found matching your search.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>

    <script>
        const grid = document.getElementById('contentGrid');

        // 🔒 AUTH GUARD (Uses global 'auth' from your JS files or firebase directly)
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                localStorage.setItem("redirectAfterLogin", "notes.html");
                window.location.href = "login.html";
            } else {
                document.getElementById('main-ui').style.display = 'block';
                loadNotes();
            }
        });

        function loadNotes() {
            db.collection("notes").onSnapshot(snap => {
                let nData = [];
                snap.forEach(doc => { 
                    let d = doc.data(); d.id = doc.id;
                    if(d.deleteStatus === 'Active' || !d.isDeleted) nData.push(d); 
                });
                nData.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if(nData.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; padding: 60px 20px; background:#fff; border-radius:16px; border:2px dashed #cbd5e1;">
                            <i class="fa-solid fa-folder-open" style="font-size: 40px; color: #94a3b8; margin-bottom: 15px;"></i>
                            <h4 style="margin: 0 0 8px; color: #0f172a; font-family: 'Poppins'; font-size: 18px;">No Notes Available</h4>
                            <p style="margin: 0; color: #64748b; font-size: 14px;">Study materials will be uploaded here soon.</p>
                        </div>`;
                    return;
                }

                let html = '';
                nData.forEach(item => {
                    const dateStr = item.timestamp ? new Date(item.timestamp.seconds*1000).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recently Added';
                    const subject = item.subject || 'General';
                    const safeSearchTitle = item.title ? item.title.toLowerCase().replace(/"/g, '&quot;') : '';
                    const safeLink = item.link ? item.link.replace(/'/g, "\\'") : '#';
                    
                    html += `
                    <div class="note-card search-item" data-title="${safeSearchTitle}">
                        <span style="background: #ecfdf5; color: #10b981; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; align-self: flex-start; text-transform: uppercase;">${subject}</span>
                        <h3 style="margin: 15px 0 5px; font-family: 'Poppins'; color: #0f172a; font-size: 16px; line-height: 1.4;">${item.title}</h3>
                        <div class="note-meta">
                            <span><i class="fa-regular fa-calendar"></i> ${dateStr}</span>
                        </div>
                        <button onclick="openNote('${safeLink}', '${item.id}')" class="start-btn"><i class="fa-solid fa-file-pdf"></i> View PDF</button>
                    </div>`;
                });
                grid.innerHTML = html;
            }, e => { 
                console.error("Firebase error: ", e);
                grid.innerHTML = `<div style="color:red; grid-column:1/-1; text-align:center; padding: 20px;">Error loading notes. Retrying...</div>`; 
            });
        }

        function openNote(link, docId) {
            window.open(link, '_blank');
            if(docId) db.collection("notes").doc(docId).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
        }

        // 🟢 NEW: LIVE SEARCH FUNCTION LOGIC 🟢
        function filterNotes() {
            let input = document.getElementById('notes-search-box').value.toLowerCase();
            let cards = document.querySelectorAll('.search-item');
            let visibleCount = 0;
            let noResultsMsg = document.getElementById('no-results-msg');

            cards.forEach(card => {
                let title = card.getAttribute('data-title');
                
                // If input matches title, show card; else hide it
                if (title.includes(input)) {
                    card.style.display = 'flex'; // Uses standard flexbox display to not break your grid
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // Show "No Results" message if everything is hidden
            if (visibleCount === 0 && cards.length > 0) {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
            }
        }
    </script>
</body>
</html>
