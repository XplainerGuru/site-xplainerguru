<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Team | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .container { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
        .team-card { 
            background: #0f172a; color: #fff; padding: 50px; border-radius: 32px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: relative; overflow: hidden; margin-bottom: 40px; 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2); 
            scroll-margin-top: 100px; /* Header space fix */
        }
        .badge { background: #f59e0b; color: #0f172a; padding: 8px 18px; border-radius: 50px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; }
        .d-btn { padding: 14px 28px; border-radius: 12px; background: rgba(255,255,255,0.1); color: #fff; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 25px; font-size: 14px; }
        .bg-logo { height: 160px; filter: grayscale(1) invert(1); opacity: 0.08; position: absolute; right: -20px; bottom: -20px; }
        @media(max-width:768px) { .team-card { flex-direction:column; text-align:center; padding: 40px 30px; } }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; margin-bottom:50px; font-family:'Poppins'; color:#0f172a;">Academic Leadership</h2>
        <div class="team-card" id="mentor">
            <div style="position: relative; z-index: 2;">
                <div class="badge" style="background:#2563eb; color:#fff;">Chief Mentor</div>
                <h2 style="margin-top:20px; font-family:'Poppins'; font-size: 2rem;">Shiwendu Kaushal</h2>
                <p style="opacity:0.8; max-width:450px; margin-top:15px; line-height: 1.6;">Simplifying academic concepts and guiding students toward excellence.</p>
                <a id="s-ig" href="#" target="_blank" class="d-btn">Instagram Profile</a>
            </div>
            <img src="logo.png" class="bg-logo">
        </div>

        <h2 style="text-align:center; margin-bottom:50px; margin-top:80px; font-family:'Poppins'; color:#0f172a;">Platform Foundation</h2>
        <div class="team-card" id="foundation">
            <div style="position: relative; z-index: 2;">
                <div class="badge">Lead Architect</div>
                <h2 style="margin-top:20px; font-family:'Poppins'; font-size: 2rem;" id="dev-name">Ashutosh Kaushal</h2>
                <p style="opacity:0.8; max-width:450px; margin-top:15px; line-height: 1.6;" id="dev-bio">Loading...</p>
                <div>
                    <a id="dev-ig" href="#" target="_blank" class="d-btn" style="margin-right: 10px;">Instagram</a>
                    <a id="dev-li" href="#" target="_blank" class="d-btn">LinkedIn</a>
                </div>
            </div>
            <img src="logo.png" class="bg-logo">
        </div>
    </div>
    <script src="content.js"></script><script src="master.js"></script>
    <script>
        document.getElementById('s-ig').href = CONFIG.mentor.ig;
        document.getElementById('dev-name').innerText = CONFIG.developer.name;
        document.getElementById('dev-bio').innerText = CONFIG.developer.bio;
        document.getElementById('dev-ig').href = CONFIG.developer.ig;
        document.getElementById('dev-li').href = CONFIG.developer.li;
    </script>
</body>
</html>
