<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Tests | Xplainer Guru</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body style="background: #f8fafc;">
    <script src="content.js"></script>
    <script src="master.js"></script>
    <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <h1 style="font-family:'Poppins'; color:#000080;">Mock Tests <span style="font-size: 14px; color:#d97706;">(Coming Soon)</span></h1>
        <div id="list"></div>
    </div>
    <script>
        const container = document.getElementById('list');
        mockTests.forEach(t => {
            container.innerHTML += `
            <div style="background:#fff; padding:25px; border-radius:20px; border:1px solid #eef2f6; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; opacity:0.7;">
                <div><h3 style="margin:0; font-family:'Poppins';">${t.title}</h3><small style="color:#64748b;">${t.questions} Questions | ${t.time} Mins</small></div>
                <button style="background:#e2e8f0; color:#64748b; padding:10px 20px; border-radius:8px; border:none; font-weight:700; cursor:not-allowed;">Coming Soon</button>
            </div>`;
        });
    </script>
</body>
</html>
