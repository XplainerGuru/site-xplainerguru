<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests | Xplainer Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .coming-soon-container { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; background: #f4f7ff; }
        .cs-card { background: white; padding: 50px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,128,0.05); max-width: 500px; width: 100%; }
        .cs-icon { font-size: 60px; color: #000080; margin-bottom: 20px; animation: bounce 2s infinite; }
        h1 { font-family: 'Poppins', sans-serif; color: #0f172a; margin-bottom: 15px; }
        .notify-btn { background: #000080; color: white; border: none; padding: 16px 35px; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .notify-btn:hover { transform: translateY(-3px); background: #2563eb; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <div class="cs-card">
            <div class="cs-icon"><i class="fa-solid fa-flask-vial"></i></div>
            <h1>Mock Tests <br><span style="color:#2563eb">Coming Soon</span></h1>
            <p>Waitlist join karein! Jab tests live honge, aapko sabse pehle notification milega.</p>
            
            <button class="notify-btn" onclick="handleNotifyClick()">
                <i class="fa-solid fa-bell"></i> Notify Me
            </button>
        </div>
    </div>

    <script src="master.js"></script>

    <script>
        function handleNotifyClick() {
            const userStr = localStorage.getItem('xg_user');
            const user = userStr ? JSON.parse(userStr) : null;

            if (user) {
                // Scenario 1: User Logged In
                if (!user.whatsapp || user.whatsapp === "N/A") {
                    const wa = prompt("Aapka WhatsApp number? (Notification ke liye)");
                    if (wa) {
                        user.whatsapp = wa;
                        localStorage.setItem('xg_user', JSON.stringify(user));
                        syncData(user);
                    }
                } else {
                    syncData(user);
                }
            } else {
                // Scenario 2: Guest User (No Login Required)
                const email = prompt("Aapka Email ID?");
                if (email && email.includes("@")) {
                    const wa = prompt("Aapka WhatsApp number? (Optional - Cancel dabayein agar nahi dena)");
                    
                    const guestData = {
                        name: "Guest User",
                        email: email,
                        whatsapp: wa || "N/A",
                        interest: "Waitlist Guest",
                        source: "Test Page Notify"
                    };
                    syncData(guestData);
                } else if (email !== null) {
                    alert("Kripya sahi email dalein!");
                }
            }
        }

        function syncData(data) {
            alert("Success! Humne aapko waitlist mein add kar liya hai.");
            if (window.syncToSheet) {
                window.syncToSheet(data);
            }
        }
    </script>
</body>
</html>
