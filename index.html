<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xplainer Guru | Home</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Poppins:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://paulirish.github.io/lite-youtube-embed/src/lite-yt-embed.css" />
    <style>
        .hero { background: #1e3a8a; color: #fff; text-align: center; padding: 100px 20px 140px; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; }
        .slider-wrapper { position: relative; max-width: 1000px; margin: -60px auto 40px; overflow: hidden; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .slider-track { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; background: #fff; }
        lite-youtube { width: 100% !important; max-width: 100%; aspect-ratio: 16/9; border: none; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,128,0.7); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 24px; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .btn-prev { left: 15px; } .btn-next { right: 15px; }
        .slide-info { padding: 25px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <section class="hero"><h1 style="font-family:'Poppins';">Master Your Syllabus</h1><p>Premium lectures and professional notes.</p></section>
    <div class="slider-wrapper">
        <button class="nav-btn btn-prev" onclick="manual(-1)">&lt;</button>
        <button class="nav-btn btn-next" onclick="manual(1)">&gt;</button>
        <div class="slider-track" id="track"></div>
    </div>
    <script src="content.js"></script><script src="master.js"></script>
    <script src="https://paulirish.github.io/lite-youtube-embed/src/lite-yt-embed.js"></script>
    <script>
        const track = document.getElementById('track');
        let index = 0;
        contentDatabase.forEach(item => {
            const slide = document.createElement('div'); slide.className = 'slide';
            slide.innerHTML = `<lite-youtube videoid="${item.id}"></lite-youtube><div class="slide-info"><h3 style="margin:0; font-family:'Poppins';">${item.title}</h3></div>`;
            track.appendChild(slide);
        });
        function update() { track.style.transform = `translateX(-${index * 100}%)`; }
        function move() { index = (index + 1) % contentDatabase.length; update(); }
        function manual(step) { clearInterval(auto); index = (index + step + contentDatabase.length) % contentDatabase.length; update(); auto = setInterval(move, 5000); }
        let auto = setInterval(move, 5000);
    </script>
</body>
</html>
