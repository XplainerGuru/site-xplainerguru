<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Xplainer Guru | Home</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Poppins:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://paulirish.github.io/lite-youtube-embed/src/lite-yt-embed.css" />
    <style>
        .banner-link { width: 100%; display: block; margin: 5px 0 25px; text-decoration: none; }
        .banner-link img { width: 100%; height: auto; display: block; object-fit: contain; }
        .wa-box { max-width: 900px; margin: 0 auto 30px; padding: 25px; background: #f0fdf4; border-radius: 20px; border: 1px solid #dcfce7; text-align: center; }
        .slider-wrapper { position: relative; width: 100%; max-width: 1000px; margin: 0 auto 40px; overflow: hidden; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #fff; }
        .slider-track { display: flex; transition: transform 0.6s ease; width: 100%; }
        .slide { min-width: 100%; width: 100%; }
        lite-youtube { width: 100% !important; max-width: 100% !important; aspect-ratio: 16/9; display: block; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,128,0.7); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 100; font-size: 20px; }
    </style>
</head>
<body>
    <a href="https://whatsapp.com/channel/0029Vb7p4QV0QeadmOIpgx36" class="banner-link" target="_blank"><img src="banner.jpg"></a>

    <div class="wa-box">
        <h3 style="margin:0; font-family:'Poppins'; color:#166534;">Join Our Channel</h3>
        <a href="https://whatsapp.com/channel/0029Vb7p4QV0QeadmOIpgx36" style="color:#25d366; font-weight:800; text-decoration:none; display:block; margin-top:10px;" target="_blank">Follow WhatsApp Channel &rarr;</a>
    </div>

    <div class="slider-wrapper">
        <button class="nav-btn" style="left:15px;" onclick="manual(-1)">&lt;</button>
        <button class="nav-btn" style="right:15px;" onclick="manual(1)">&gt;</button>
        <div class="slider-track" id="track"></div>
    </div>

    <script src="content.js"></script>
    <script src="master.js"></script>
    <script src="https://paulirish.github.io/lite-youtube-embed/src/lite-yt-embed.js"></script>
    <script>
        const track = document.getElementById('track');
        contentDatabase.forEach(item => {
            const slide = document.createElement('div'); slide.className = 'slide';
            slide.innerHTML = `<lite-youtube videoid="${item.id}"></lite-youtube><div style="padding:15px;"><h4 style="margin:0; font-family:'Poppins';">${item.title}</h4></div>`;
            track.appendChild(slide);
        });
        let index = 0;
        function update() { track.style.transform = `translateX(-${index * 100}%)`; }
        function manual(step) { clearInterval(auto); index = (index + step + contentDatabase.length) % contentDatabase.length; update(); auto = setInterval(() => { index = (index + 1) % contentDatabase.length; update(); }, 5000); }
        let auto = setInterval(() => { index = (index + 1) % contentDatabase.length; update(); }, 5000);
    </script>
</body>
</html>
