<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Xplainer Guru | Global Admin</title>

    <link rel="icon" href="data:,">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 80vh;
            font-family: 'Manrope', sans-serif;
        }

        .page-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .portal-tag {
            display: inline-block;
            font-weight: 800;
            color: #f59e0b;
            font-size: 20px;
            background: #fffbeb;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #fde68a;
        }

        /* LIVE SEARCH BAR CSS */
        .live-search-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        .live-search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .live-search-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border-radius: 50px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-family: 'Manrope';
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            font-size: 15px;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .live-search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
        }

        .dash-card {
            background: white;
            border-radius: 16px;
            padding: clamp(15px, 3vw, 25px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .admin-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }

        .admin-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .mic-on {
            background: #fee2e2 !important;
            color: #ef4444 !important;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .center-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            z-index: 11000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            padding: 20px;
        }

        .center-modal-card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* LOOKUP TABLE CSS */
        .lookup-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        .lookup-table th {
            text-align: left;
            padding: 8px;
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
        }

        .lookup-table td {
            padding: 8px;
            border-bottom: 1px solid #f1f5f9;
        }
    </style>
</head>

<body>

    <div id="loader"
        style="position: fixed; inset: 0; background: white; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #f59e0b;"></i>
        <p style="margin-top: 15px; font-weight: 700; color: #f59e0b; font-family: 'Manrope';">Verifying Admin
            Privileges...</p>
    </div>

    <div class="dashboard-container" id="dashboard-main-content" style="display: none;">

        <div class="page-header-row">
            <button onclick="window.location.href='dashboard.html'"
                style="background: transparent; border: 1px solid #e2e8f0; padding: 8px 15px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: #0f172a;"><i
                    class="fa-solid fa-arrow-left"></i> Exit to Dashboard</button>
            <span class="portal-tag"><i class="fa-solid fa-shield-halved"></i> Global Admin Console</span>
            <div style="width: 100px;"></div>
        </div>

        <div class="live-search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="admin-live-search" class="live-search-input" onkeyup="liveSearch()"
                placeholder="Search modules, tickets, or tools...">
        </div>

        <div class="dash-card" style="border-top: 4px solid #8b5cf6; margin-bottom: 30px;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3
                    style="margin: 0; font-family: 'Poppins'; color: #0f172a; display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-eye" style="color: #8b5cf6;"></i> User 360° Lookup
                </h3>
                <div style="display: flex; gap: 10px; flex: 1; max-width: 400px;">
                    <input type="text" id="lookup-uid" class="admin-input" style="margin: 0; flex: 1;"
                        placeholder="Enter User UID...">
                    <button onclick="searchUserDatabase()" class="admin-btn"
                        style="width: auto; background: #8b5cf6;"><i class="fa-solid fa-search"></i> Search</button>
                </div>
            </div>

            <div id="lookup-result-area"
                style="display: none; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 15px;">
            </div>
        </div>

        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div id="inject-mic-radar"></div>
            <div id="inject-broadcast-widget"></div>
            <div id="inject-ticket-radar"></div>
        </div>

        <div class="dash-card" style="border-top: 4px solid #10b981; margin-bottom: 30px; background: #f0fdf4;">
            <h3 style="margin:0 0 15px; color:#0f172a; font-family:'Poppins';"><i class="fa-solid fa-user-clock"
                    style="color:#10b981;"></i> Pending Team Approvals</h3>
            <div id="pending-review-list">Loading pending applications...</div>
        </div>

        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div id="inject-academic-pool"></div>
            <div id="inject-tech-pool"></div>
        </div>
        <div id="inject-content-studio"></div>
        <div id="inject-mock-test-studio"></div>
    </div>

    <div id="mic-modal" class="center-modal-overlay">
        <div class="center-modal-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 40px; color: #ef4444; margin-bottom: 10px;"><i
                        class="fa-solid fa-tower-broadcast"></i></div>
                <h2 style="margin: 0; font-family: 'Poppins', sans-serif; color: #0f172a;">Global Megaphone</h2>
            </div>
            <input type="text" id="mic-tag" class="admin-input" placeholder="Tagline (e.g., URGENT)" required>
            <textarea id="mic-msg" class="admin-input" placeholder="Message..." rows="3" required></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeModal('mic-modal')"
                    style="flex: 1; padding: 12px; border: none; border-radius: 8px; background: #e2e8f0; cursor: pointer; font-weight: 700;">Cancel</button>
                <button onclick="sendMicBroadcast()"
                    style="flex: 1; padding: 12px; border: none; border-radius: 8px; background: #ef4444; color: white; cursor: pointer; font-weight: 700;">Broadcast</button>
            </div>
        </div>
    </div>

    <div id="broadcast-modal" class="center-modal-overlay">
        <div class="center-modal-card" style="border-top: 6px solid #f59e0b;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin:0; font-family:'Poppins'; font-size:18px; color:#d97706;"><i
                        class="fa-solid fa-paper-plane"></i> Targeted Notification</h3>
                <button onclick="closeModal('broadcast-modal')"
                    style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>
            <input type="text" id="bcast-title" placeholder="Notification Title" class="admin-input">
            <textarea id="bcast-body-text" placeholder="Notification Message..." class="admin-input"
                rows="3"></textarea>
            <select id="bcast-target" class="admin-input" style="cursor:pointer;"
                onchange="document.getElementById('bcast-dept-container').style.display = this.value === 'department' ? 'block' : 'none'">
                <option value="everyone">Everyone (All Users)</option>
                <option value="students">Only Students</option>
                <option value="department">Specific Department Team</option>
            </select>
            <div id="bcast-dept-container" style="display:none;">
                <select id="bcast-dept" class="admin-input" style="cursor:pointer;">
                    <option value="MNT">Academic / Mentor Pool</option>
                    <option value="SUP">Tech / Support Pool</option>
                </select>
            </div>
            <button onclick="sendTargetedBroadcast()" class="admin-btn" style="background: #f59e0b; color: #0f172a;"><i
                    class="fa-solid fa-paper-plane"></i> Send Push Notification</button>
        </div>
    </div>

    <div id="ticket-reply-modal" class="center-modal-overlay">
        <div class="center-modal-card" style="border-top: 6px solid #2563eb;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin:0; font-family:'Poppins'; font-size:18px; color:#2563eb;"><i
                        class="fa-solid fa-reply"></i> Resolve Ticket</h3>
                <button onclick="closeModal('ticket-reply-modal')"
                    style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>

            <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px;">
                <strong style="color: #0f172a;">Student Query:</strong>
                <p id="reply-modal-desc" style="margin: 5px 0 0; color: #475569;"></p>
            </div>

            <input type="hidden" id="reply-ticket-id">
            <input type="hidden" id="reply-student-email">
            <input type="hidden" id="reply-ticket-subject">
            
            <textarea id="reply-msg" placeholder="Type your official answer here..." class="admin-input" rows="4" required></textarea>
            <button onclick="submitTicketReply()" class="admin-btn" style="background: #2563eb; color: white;">
                <i class="fa-solid fa-check-circle"></i> Mark as Solved & Send Reply
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>

    <script>
        // LIVE SEARCH FUNCTION
        function liveSearch() {
            let filter = document.getElementById('admin-live-search').value.toLowerCase();
            let cards = document.querySelectorAll('.dash-card');
            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                if (text.includes(filter)) card.style.display = '';
                else card.style.display = 'none';
            });
        }

        // 🟢 ADVANCED & FIXED: USER 360 LOOKUP LOGIC
        async function searchUserDatabase() {
            const inputStr = document.getElementById('lookup-uid').value.trim();
            const resultArea = document.getElementById('lookup-result-area');

            if (!inputStr) return alert("Please enter a Student ID (e.g., XG-STU-XXXXXX) or Email ID.");

            resultArea.style.display = 'block';
            resultArea.innerHTML = `<div style="text-align:center; padding: 20px;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#8b5cf6;"></i><p style="margin-top:10px; color:#64748b;">Scanning global database...</p></div>`;

            try {
                const db = firebase.firestore();
                let targetUid = null;
                let userData = null;

                if (inputStr.includes('@')) {
                    // 1. Search by Email
                    const userSnap = await db.collection('users').where('email', '==', inputStr.toLowerCase()).limit(1).get();
                    if (!userSnap.empty) { targetUid = userSnap.docs[0].id; userData = userSnap.docs[0].data(); }
                } else if (inputStr.toUpperCase().startsWith('XG-')) {
                    // 2. Search by Custom ID (Smart Scanner Fix)
                    const targetShortId = inputStr.toUpperCase();
                    const usersSnap = await db.collection('users').get(); // Fetching to match generated IDs

                    for (const doc of usersSnap.docs) {
                        const uData = doc.data();
                        let roleCode = uData.role === 'student' ? 'STU' : (uData.role === 'parent' ? 'PRN' : 'MNT');
                        let generatedId = `XG-${roleCode}-${doc.id.substring(0, 6).toUpperCase()}`;

                        if (generatedId === targetShortId) {
                            targetUid = doc.id;
                            userData = uData;
                            break; // Match found, stop scanning
                        }
                    }
                } else {
                    // 3. Search by raw UID
                    const userDoc = await db.collection('users').doc(inputStr).get();
                    if (userDoc.exists) { targetUid = userDoc.id; userData = userDoc.data(); }
                }

                if (!targetUid) {
                    resultArea.innerHTML = `<div style="text-align:center; color:#ef4444; padding:20px; border:1px solid #fecaca; background:#fef2f2; border-radius:8px;">❌ No user found with ID or Email: <b>${inputStr}</b></div>`;
                    return;
                }

                // Fetch Recent Tests
                const testsSnap = await db.collection('test_results').where('uid', '==', targetUid).get();
                let tests = [];
                testsSnap.forEach(doc => tests.push(doc.data()));
                tests.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                // Fetch Help Desk Tickets
                const ticketsSnap = await db.collection('tickets').where('uid', '==', targetUid).get();
                let tickets = [];
                ticketsSnap.forEach(doc => { let t = doc.data(); t.id = doc.id; tickets.push(t); });
                tickets.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

                // HTML Build Process
                let testsHtml = tests.length === 0 ? "<tr><td colspan='4' style='text-align:center; color:#64748b;'>No mock tests attempted yet.</td></tr>" : "";
                tests.slice(0, 5).forEach(td => {
                    testsHtml += `<tr>
                        <td><b style="color:#0f172a;">${td.testTitle}</b></td>
                        <td style="color:${td.accuracy >= 70 ? '#16a34a' : '#ef4444'}; font-weight:bold;">${td.accuracy}%</td>
                        <td>${td.score}</td>
                        <td style="color:#64748b;">${Math.floor(td.timeSpent / 60)}m ${td.timeSpent % 60}s</td>
                    </tr>`;
                });

                let ticketsHtml = tickets.length === 0 ? "<div style='color:#64748b; font-size:13px; text-align:center; padding:20px;'>No tickets raised by this user.</div>" : "";
                tickets.forEach(tk => {
                    let badge = tk.status === 'solved'
                        ? '<span style="color:#16a34a; font-weight:800; font-size:10px; background:#dcfce7; padding:2px 6px; border-radius:4px;">SOLVED</span>'
                        : '<span style="color:#d97706; font-weight:800; font-size:10px; background:#fef3c7; padding:2px 6px; border-radius:4px;">PENDING</span>';

                    ticketsHtml += `
                        <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #f8fafc;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px; align-items:flex-start;">
                                <strong style="font-size:14px; color:#0f172a;">${tk.subject}</strong>
                                ${badge}
                            </div>
                            <p style="font-size:12px; color:#475569; margin:0 0 10px 0;">${tk.description}</p>
                            ${tk.reply ? `<div style="background:#eff6ff; padding:10px; border-left:3px solid #3b82f6; border-radius:4px; font-size:12px;"><b style="color:#2563eb;">Admin Reply:</b> <span style="color:#1e3a8a;">${tk.reply}</span></div>` : ''}
                        </div>
                    `;
                });

                let roleCode = userData.role === 'student' ? 'STU' : (userData.role === 'parent' ? 'PRN' : 'MNT');
                let customXgId = `XG-${roleCode}-${targetUid.substring(0, 6).toUpperCase()}`;

                resultArea.innerHTML = `
                    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 25px; background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                        <img src="https://ui-avatars.com/api/?name=${userData.name}&background=8b5cf6&color=fff" style="width: 70px; height: 70px; border-radius: 50%; border: 3px solid #ede9fe;">
                        <div style="flex: 1;">
                            <h2 style="margin: 0 0 5px; font-size: 22px; color: #0f172a; font-family:'Poppins';">${userData.name}</h2>
                            <div style="font-size: 13px; color: #64748b; margin-bottom: 10px;"><i class="fa-solid fa-envelope"></i> ${userData.email}</div>
                            <div style="display:flex; gap:10px;">
                                <span style="background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; border: 1px solid #bfdbfe;"><i class="fa-solid fa-id-card"></i> ${customXgId}</span>
                                <span style="background: #f1f5f9; color: #475569; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; text-transform: uppercase; border: 1px solid #e2e8f0;"><i class="fa-solid fa-user-tag"></i> ROLE: ${userData.role}</span>
                            </div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.02);">
                            <h3 style="margin: 0 0 15px; font-size: 16px; color: #0f172a; font-family:'Poppins';"><i class="fa-solid fa-chart-line" style="color: #10b981;"></i> Recent Test Activity</h3>
                            <div style="overflow-x: auto;">
                                <table class="lookup-table">
                                    <thead><tr><th>Test Name</th><th>Accuracy</th><th>Score</th><th>Time Spent</th></tr></thead>
                                    <tbody>${testsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.02); max-height: 400px; overflow-y: auto;">
                            <h3 style="margin: 0 0 15px; font-size: 16px; color: #0f172a; font-family:'Poppins'; position: sticky; top: -20px; background: white; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;"><i class="fa-solid fa-headset" style="color: #ef4444;"></i> Help Desk History</h3>
                            ${ticketsHtml}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<span style="color: #ef4444;">Error fetching data. Please check your internet connection.</span>`;
            }
        }

        // 🟢 NEW: CONTENT STUDIO UPLOAD LOGIC
        async function uploadVideoContent(e) {
            e.preventDefault();
            const title = document.getElementById('vid-title').value;
            const url = document.getElementById('vid-url').value;
            const subject = document.getElementById('vid-subject').value;

            try {
                await firebase.firestore().collection('videos').add({
                    title: title, url: url, subject: subject,
                    uploadedBy: "Admin", timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Video Uploaded Successfully! Students can now see it.");
                e.target.reset();
            } catch (err) { alert("Upload failed: " + err.message); }
        }

        async function uploadPdfNote(e) {
            e.preventDefault();
            const title = document.getElementById('note-title').value;
            const link = document.getElementById('note-link').value;
            const subject = document.getElementById('note-subject').value;

            try {
                await firebase.firestore().collection('notes').add({
                    title: title, link: link, subject: subject,
                    uploadedBy: "Admin", timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Notes Uploaded Successfully!");
                e.target.reset();
            } catch (err) { alert("Upload failed: " + err.message); }
        }

        async function uploadArticleContent(e) {
            e.preventDefault();
            const title = document.getElementById('art-title').value;
            const content = document.getElementById('art-content').value;
            const category = document.getElementById('art-category').value;

            try {
                await firebase.firestore().collection('articles').add({
                    title: title, content: content, category: category,
                    uploadedBy: "Admin", timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Article Published Successfully!");
                e.target.reset();
            } catch (err) { alert("Upload failed: " + err.message); }
        }

        // 🟢 3. FIXED: TICKET REPLY LOGIC (Send Resolution Email)
        let currentReplyTicket = {}; // Memory to store ticket details while modal is open

       // 🟢 FIXED & BULLETPROOF: TICKET REPLY LOGIC
        function openTicketReplyModal(ticketId, description, studentEmail, subject) {
            // Save data securely in hidden HTML inputs
            document.getElementById('reply-ticket-id').value = ticketId;
            document.getElementById('reply-student-email').value = studentEmail || 'No Email';
            document.getElementById('reply-ticket-subject').value = subject || 'Support Ticket';
            
            document.getElementById('reply-modal-desc').innerText = description || "No description provided.";
            document.getElementById('reply-msg').value = '';
            
            openModal('ticket-reply-modal');
        }

        async function submitTicketReply() {
            // Read data from hidden inputs
            const tId = document.getElementById('reply-ticket-id').value;
            const studentEmail = document.getElementById('reply-student-email').value;
            const subject = document.getElementById('reply-ticket-subject').value;
            const replyMsg = document.getElementById('reply-msg').value;

            if (!replyMsg) return alert("Please type a reply.");
            if (!tId) return alert("Critical Error: Ticket ID is missing. Please close and reopen the modal.");

            const btn = event.target.closest('.admin-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resolving & Sending Email...';
            btn.disabled = true;

            try {
                // 1. Update Firebase to Solved
                await firebase.firestore().collection("tickets").doc(tId).update({
                    status: 'solved',
                    reply: replyMsg,
                    resolvedBy: 'Admin',
                    resolvedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. Trigger Resolution Email to Student via Apps Script
                if(studentEmail !== 'No Email') {
                    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7HnmqV789rjclioBMa2kwNELRkrMqEcH21e3pzyqosok6Q371TNW4aiVLBb4rE0Zk/exec";
                    
                    const emailBody = `Hello,\n\nYour support ticket regarding "${subject}" has been successfully resolved by our team.\n\nAdmin Response:\n"${replyMsg}"\n\nYou can view the full details in your Xplainer Guru Dashboard.\n\nRegards,\nXplainer Guru Support`;
                    
                    const params = new URLSearchParams();
                    params.append("action", "admin_direct_email");
                    params.append("studentEmail", studentEmail);
                    params.append("subject", "✅ Ticket Resolved: " + subject);
                    params.append("message", emailBody);

                    // Send silently
                    fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params })
                        .catch(e => console.log("Email trigger failed:", e));
                }

                alert("✅ Ticket Solved & Email Notification Sent to Student!");
                closeModal('ticket-reply-modal');
            } catch (e) {
                console.error("Resolve Error:", e);
                alert("Failed to resolve ticket: " + e.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        // 🟢 1. FETCH PENDING APPROVALS
        function fetchPendingUsers() {
            const db = firebase.firestore();
            db.collection('users').where('accountStatus', '==', 'pending').onSnapshot(snap => {
                let html = '';
                snap.forEach(doc => {
                    let u = doc.data();
                    html += `<div style="background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <strong style="color: #0f172a; font-size: 15px;">${u.name}</strong> <span style="font-size:12px; color: #64748b;">(${u.email})</span><br>
                            <span style="font-size: 11px; background: #fef3c7; color: #d97706; padding: 2px 6px; border-radius: 4px; font-weight: 800;">APPLIED FOR: ${u.role.toUpperCase()}</span>
                        </div>
                        <button onclick="approveUser('${doc.id}', '${u.email}', '${u.name}', '${u.role}')" class="admin-btn" style="width: auto; background: #10b981; padding: 8px 15px; font-size: 13px;"><i class="fa-solid fa-check"></i> Approve Role</button>
                    </div>`;
                });
                document.getElementById('pending-review-list').innerHTML = html || '<p style="color:#166534; font-size: 14px; font-weight: 600;">No pending approvals! All caught up.</p>';
            });
        }

       // 🟢 1. FIXED: APPROVE USER LOGIC (Google Sheet Integration)
        async function approveUser(uid, email, name, role) {
            if (!confirm(`Are you sure you want to approve ${name} as ${role.toUpperCase()}?`)) return;

            try {
                // Update Firebase Status
                await firebase.firestore().collection('users').doc(uid).update({ accountStatus: 'active' });

                // Trigger Google Sheet Update & WhatsApp Link Email
                const params = new URLSearchParams();
                params.append("action", "approve_user");
                params.append("email", email);
                params.append("name", name);
                params.append("role", role);

                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7HnmqV789rjclioBMa2kwNELRkrMqEcH21e3pzyqosok6Q371TNW4aiVLBb4rE0Zk/exec"; // <-- Dhyan se URL dalein
                fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params }).catch(e => console.log(e));

                alert(`✅ ${name} approved successfully! WhatsApp link sent to their email.`);
            } catch (e) { alert("Error approving user: " + e.message); }
        }

        // 🟢 2. FIXED: FETCH LIVE TICKETS (Show Custom Student ID)
        function fetchPendingTickets() {
            const db = firebase.firestore();
            db.collection('tickets').where('status', '==', 'pending').onSnapshot(snap => {
                let aHtml = '', tHtml = '';
                let acount = 0, tcount = 0;

                snap.forEach(doc => {
                    const t = doc.data();
                    
                    // Generate exact Student Custom ID (e.g., XG-STU-A1B2C3)
                    let stuId = t.uid ? `XG-STU-${t.uid.substring(0, 6).toUpperCase()}` : 'UNKNOWN';

                    const card = `<div style="background:white; padding:15px; margin-bottom:10px; border-radius:8px; border:1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span style="font-size:11px; color:#94a3b8; font-weight:bold;">TKT: #${doc.id.substring(0, 6).toUpperCase()}</span>
                            <span style="font-size:11px; color:#2563eb; background:#eff6ff; padding:2px 6px; border-radius:4px; font-weight:bold;">BY: ${stuId}</span>
                        </div>
                        <h4 style="margin:0 0 5px; color:#0f172a;">${t.subject}</h4>
                        <p style="font-size:12px; color:#475569; margin:0 0 10px;">${t.description}</p>
                        <button onclick="openTicketReplyModal('${doc.id}', '${t.description.replace(/'/g, "\\'")}', '${t.raisedByEmail || ''}', '${t.subject.replace(/'/g, "\\'")}')" class="admin-btn" style="background:#2563eb; padding:8px; font-size:13px;"><i class="fa-solid fa-reply"></i> Resolve</button>
                    </div>`;

                    if (t.category === 'academic') { aHtml += card; acount++; }
                    else { tHtml += card; tcount++; }
                });

                document.getElementById('academic-ticket-list').innerHTML = aHtml || '<p style="color:#64748b; padding: 10px; text-align:center;">No pending academic queries.</p>';
                document.getElementById('tech-ticket-list').innerHTML = tHtml || '<p style="color:#64748b; padding: 10px; text-align:center;">No pending tech issues.</p>';

                if (document.getElementById('academic-count')) document.getElementById('academic-count').innerText = acount;
                if (document.getElementById('tech-count')) document.getElementById('tech-count').innerText = tcount;
            });
        }

        // CBT MOCK TEST PUBLISHER (KEPT UNTOUCHED)
        window.currentMockTestQuestions = [];
        function saveMockQuestion(e, form) {
            e.preventDefault();
            const qData = {
                text: document.getElementById('mq-text').value,
                image: document.getElementById('mq-img').value || null,
                options: {
                    A: document.getElementById('mq-opt-a').value,
                    B: document.getElementById('mq-opt-b').value,
                    C: document.getElementById('mq-opt-c').value,
                    D: document.getElementById('mq-opt-d').value
                },
                correctAnswer: document.getElementById('mq-correct').value,
                solutionEng: document.getElementById('mq-sol-eng').value,
                solutionHin: document.getElementById('mq-sol-hin').value,
                ytLink: document.getElementById('mq-yt-link').value || null
            };
            window.currentMockTestQuestions.push(qData);
            document.getElementById('q-counter').innerText = window.currentMockTestQuestions.length;
            let qFields = form.querySelectorAll('.q-field');
            qFields.forEach(field => {
                if (field.tagName === 'SELECT') { field.selectedIndex = 0; }
                else { field.value = ''; }
            });
            alert(`✅ Question ${window.currentMockTestQuestions.length} saved to memory. Add another or click Publish!`);
        }

        async function publishFullTest(e) {
            e.preventDefault();
            const btn = e.target.closest('.admin-btn');
            const title = document.getElementById('mt-title').value;
            const subject = document.getElementById('mt-subject').value;
            const duration = document.getElementById('mt-duration').value;

            if (!title) return alert("⚠️ Please enter a Test Name at the top!");
            if (window.currentMockTestQuestions.length === 0) return alert("⚠️ Please add at least 1 question to the test before publishing!");

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing to Live Server...';
            btn.disabled = true;

            try {
                await firebase.firestore().collection("mock_tests").add({
                    title: title, subject: subject,
                    duration: duration ? parseInt(duration) : 0,
                    qCount: window.currentMockTestQuestions.length,
                    questions: window.currentMockTestQuestions,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: "active"
                });
                alert("🚀 BOOM! Test Published Successfully! Students can now see it on the Tests page.");
                window.currentMockTestQuestions = [];
                document.getElementById('q-counter').innerText = "0";
                document.getElementById('mock-test-form').reset();
            } catch (err) {
                console.error(err);
                alert("Error publishing test. Check your Firebase connection and permissions.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // MODALS LOGIC (KEPT UNTOUCHED)
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openMicModal() { openModal('mic-modal'); }

        // LIVE MIC & BROADCAST (KEPT UNTOUCHED)
        function initMicRadar() {
            if (typeof firebase === 'undefined') return;
            firebase.firestore().collection("system_settings").doc("global_mic").onSnapshot((doc) => {
                const badge = document.getElementById('mic-badge');
                const msgArea = document.getElementById('current-mic-msg');
                if (badge && msgArea && doc.exists) {
                    const data = doc.data();
                    if (data.active) {
                        badge.className = "mic-status-badge mic-on";
                        badge.innerHTML = '<i class="fa-solid fa-circle-dot"></i> LIVE NOW';
                        msgArea.innerHTML = `<span style="color:#ef4444; font-weight:800;">[${data.tag}]</span> ${data.message}`;
                    } else {
                        badge.className = "mic-status-badge mic-off";
                        badge.style.background = "#f1f5f9"; badge.style.color = "#64748b";
                        badge.innerHTML = '<i class="fa-solid fa-power-off"></i> OFFLINE';
                        msgArea.innerHTML = "No active announcements.";
                    }
                }
            });
        }

        async function turnOffMic() {
            if (confirm("Are you sure you want to stop the Global Broadcast?")) {
                try {
                    await firebase.firestore().collection("system_settings").doc("global_mic").update({ active: false });
                    alert("Global Mic turned OFF.");
                } catch (e) { alert("Failed to turn off mic. Check connection."); }
            }
        }

        async function sendMicBroadcast() {
            const tag = document.getElementById('mic-tag').value;
            const msg = document.getElementById('mic-msg').value;
            if (!msg || !tag) return alert("Required fields missing!");

            event.target.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                await firebase.firestore().collection("system_settings").doc("global_mic").set({
                    active: true, tag: tag, message: msg, link: document.getElementById('mic-link') ? document.getElementById('mic-link').value : "",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                document.getElementById('mic-tag').value = '';
                document.getElementById('mic-msg').value = '';
                closeModal('mic-modal');
            } catch (e) { alert("Failed to broadcast."); }
            event.target.innerHTML = 'Broadcast';
        }

        async function sendTargetedBroadcast() {
            const title = document.getElementById('bcast-title').value;
            const body = document.getElementById('bcast-body-text').value;
            if (!title || !body) return alert("Please fill Title and Message.");

            event.target.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            setTimeout(() => {
                alert("Notification Sent Successfully!");
                closeModal('broadcast-modal');
                document.getElementById('bcast-title').value = '';
                document.getElementById('bcast-body-text').value = '';
                event.target.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Push Notification';
            }, 1000);
        }

        // INITIALIZE EVERYTHING
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof XGComponents !== 'undefined') {
                injectComponent('inject-mic-radar', XGComponents.getGlobalMicWidget());
                injectComponent('inject-broadcast-widget', XGComponents.getBroadcastWidget());
                injectComponent('inject-ticket-radar', XGComponents.getTicketRadarWidget());

                // 🟢 NEW: Inject Pools into Admin Dashboard
                injectComponent('inject-academic-pool', XGComponents.getAcademicPoolWidget());
                injectComponent('inject-tech-pool', XGComponents.getTechPoolWidget());

                injectComponent('inject-content-studio', XGComponents.getContentStudioWidget());
                injectComponent('inject-mock-test-studio', XGComponents.getMockTestWidget());
            }

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard-main-content').style.display = 'block';
                initMicRadar();

                // 🟢 NEW: Call Fetch Functions
                fetchPendingUsers();
                fetchPendingTickets();

            }, 1500);
        });
    </script>
