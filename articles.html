<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Articles | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 font-['Manrope'] m-0 pt-[100px] flex flex-col min-h-screen text-slate-800">

    <div class="max-w-[1000px] mx-auto px-5 pb-[50px] flex-1 w-full box-border">
        
        <div class="text-center mb-[20px]">
            <h1 class="font-['Poppins'] text-slate-900 m-0 mb-2.5 text-[2.2rem]"><i class="fa-solid fa-newspaper text-blue-600"></i> Library & Articles</h1>
            <p class="text-slate-500 m-0 text-[15px]">Read tips, tricks, and detailed academic strategies.</p>
        </div>

        <div class="relative w-full max-w-[600px] mx-auto mb-[30px]">
            <i class="fa-solid fa-magnifying-glass absolute left-[18px] top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
            <input type="text" id="article-live-search" class="w-full p-[14px_15px_14px_45px] rounded-full border border-slate-300 outline-none font-['Manrope'] shadow-[0_4px_15px_rgba(0,0,0,0.05)] text-[15px] transition duration-200 box-border focus:border-blue-600 focus:shadow-[0_4px_20px_rgba(37,99,235,0.15)] bg-white" onkeyup="filterArticles()" placeholder="Search articles by title, author, or keywords...">
        </div>

        <div id="contentGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="col-span-full text-center p-[50px] text-slate-400 font-['Poppins']">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-4 text-blue-600"></i><br>Loading articles...
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>

    <script>
        const grid = document.getElementById('contentGrid');

        async function loadArticles() {
            try {
                const snap = await db.collection("articles").get();
                let aData = [];
                snap.forEach(doc => { 
                    let d = doc.data(); d.id = doc.id;
                    if(d.deleteStatus === 'Active' || !d.isDeleted) aData.push(d); 
                });
                aData.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if(aData.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center p-[40px] bg-white rounded-xl border border-dashed border-slate-300 text-slate-500">No articles published yet.</div>`;
                    return;
                }

                let html = '';
                let adInjected = false;
                aData.forEach((item, index) => {
                    const dateStr = item.timestamp ? new Date(item.timestamp.seconds*1000).toLocaleDateString() : 'New';
                    const previewText = item.content ? item.content.substring(0, 150) : '';
                    
                    // Inject Native Ad after 2nd Article (index 2 means the 3rd item)
                    if (index === 2) {
                        html += `
                        <div class="col-span-full w-full flex justify-center my-6 min-h-[50px]">
                            <div id="container-e9b12f5418d9e679de47d1e3b3183725"></div>
                        </div>`;
                        adInjected = true;
                    }

                    html += `
                    <div class="article-card flex flex-col sm:flex-row bg-white p-5 rounded-2xl border border-slate-200 cursor-pointer transition duration-300 gap-5 items-center hover:-translate-y-1 hover:shadow-[0_15px_30px_rgba(0,0,0,0.05)] hover:border-blue-600" onclick="openArticle('${item.id}')">
                        <img src="${item.cover || 'logo.png'}" class="w-full sm:w-[140px] h-[180px] sm:h-[120px] rounded-xl object-cover shrink-0 bg-slate-300" onerror="this.src='logo.png'">
                        <div class="grow text-center sm:text-left">
                            <h2 class="m-0 mb-2 font-['Poppins'] text-[18px] text-slate-900">${item.title}</h2>
                            <p class="m-0 mb-2.5 text-[14px] text-slate-500 leading-relaxed line-clamp-2">${previewText}...</p>
                            <div class="text-[12px] font-bold text-slate-400 flex justify-center sm:justify-start gap-[15px] flex-wrap">
                                <span class="text-blue-600 flex items-center gap-1.5"><i class="fa-solid fa-pen-nib"></i> ${item.authorName || 'Xplainer Guru'}</span>
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-calendar"></i> ${dateStr}</span>
                            </div>
                        </div>
                    </div>`;
                });
                grid.innerHTML = html;

                // After the HTML is in the DOM, dynamically inject the Adsterra script
                if (adInjected) {
                    const adContainer = document.getElementById('adsterra-native-articles-list');
                    if (adContainer) {
                        const adScript = document.createElement('script');
                        adScript.async = true;
                        adScript.dataset.cfasync = "false";
                        adScript.src = "https://pl29365593.profitablecpmratenetwork.com/e9b12f5418d9e679de47d1e3b3183725/invoke.js";
                        document.body.appendChild(adScript); // Append to body to ensure execution
                    }
                }
            } catch(e) { 
                grid.innerHTML = `<div class="col-span-full text-red-500 text-center font-bold">Error loading articles.</div>`; 
            }
        }

        function openArticle(id) {
            db.collection("articles").doc(id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
            window.location.href = `read.html?id=${id}`;
        }

        function filterArticles() {
            let filter = document.getElementById('article-live-search').value.toLowerCase();
            let cards = document.querySelectorAll('.article-card');
            
            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                if (text.includes(filter)) {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                } else {
                    card.classList.add('hidden');
                    card.classList.remove('flex');
                }
            });
        }

        loadArticles();
    </script>
</body>
</html>
