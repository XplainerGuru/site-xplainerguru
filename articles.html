<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Articles | Xplainer Guru</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { background: #f8fafc; font-family: 'Manrope', sans-serif; margin: 0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh;}
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 50px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .page-header { margin-bottom: 20px; text-align: center; } /* Reduced margin slightly to fit search bar */
        .page-header h1 { font-family: 'Poppins'; color: #0f172a; margin: 0 0 10px; font-size: 2.2rem;}
        .page-header p { color: #64748b; margin: 0; font-size: 15px;}

        /* 🟢 NEW: LIVE SEARCH BAR CSS */
        .live-search-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto 30px auto; }
        .live-search-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; }
        .live-search-input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 50px; border: 1px solid #cbd5e1; outline: none; font-family: 'Manrope', sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-size: 15px; transition: 0.2s; box-sizing: border-box; }
        .live-search-input:focus { border-color: #2563eb; box-shadow: 0 4px 20px rgba(37,99,235,0.15); }

        /* GRID SYSTEM FOR 2 CARDS PER ROW */
        #contentGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

        .article-card { display: flex; background: #fff; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.3s; gap: 20px; align-items: center;}
        .article-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-color: #2563eb; }
        
        .article-img { width: 140px; height: 120px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #cbd5e1;}
        .article-info { flex-grow: 1; }
        .article-info h2 { margin: 0 0 8px; font-family: 'Poppins'; font-size: 18px; color: #0f172a; }
        .article-info p { margin: 0 0 10px; font-size: 14px; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .article-meta { font-size: 12px; font-weight: 700; color: #94a3b8; display: flex; gap: 15px;}
        
        /* Spans full width for loader/empty state */
        .loader { grid-column: 1 / -1; text-align: center; padding: 50px; color: #94a3b8; font-family: 'Poppins'; }
        .empty-state { grid-column: 1 / -1; text-align:center; padding: 40px; background:#fff; border-radius:12px; border:1px dashed #cbd5e1; color:#64748b; }

        @media (max-width: 800px) {
            #contentGrid { grid-template-columns: 1fr; } /* Stack on smaller screens */
        }

        @media (max-width: 600px) {
            .article-card { flex-direction: column; text-align: center; padding: 15px;}
            .article-img { width: 100%; height: 180px; }
            .article-meta { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1><i class="fa-solid fa-newspaper" style="color: #2563eb;"></i> Library & Articles</h1>
            <p>Read tips, tricks, and detailed academic strategies.</p>
        </div>

        <div class="live-search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="article-live-search" class="live-search-input" onkeyup="filterArticles()" placeholder="Search articles by title, author, or keywords...">
        </div>

        <div id="contentGrid">
            <div class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Loading articles...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/master.js"></script>

    <script>
        const grid = document.getElementById('contentGrid');

        async function loadArticles() {
            try {
                const snap = await db.collection("articles").get();
                let aData = [];
                snap.forEach(doc => { 
                    let d = doc.data(); d.id = doc.id;
                    if(d.deleteStatus === 'Active' || !d.isDeleted) aData.push(d); 
                });
                aData.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if(aData.length === 0) {
                    grid.innerHTML = `<div class="empty-state">No articles published yet.</div>`;
                    return;
                }

                let html = '';
                aData.forEach(item => {
                    const dateStr = item.timestamp ? new Date(item.timestamp.seconds*1000).toLocaleDateString() : 'New';
                    const previewText = item.content ? item.content.substring(0, 150) : '';
                    
                    // 🔒 VIEWS REMOVED FROM PUBLIC UI
                    html += `
                    <div class="article-card" onclick="openArticle('${item.id}')">
                        <img src="${item.cover || 'logo.png'}" class="article-img" onerror="this.src='logo.png'">
                        <div class="article-info">
                            <h2>${item.title}</h2>
                            <p>${previewText}...</p>
                            <div class="article-meta">
                                <span style="color:#2563eb;"><i class="fa-solid fa-pen-nib"></i> ${item.authorName || 'Xplainer Guru'}</span>
                                <span><i class="fa-solid fa-calendar"></i> ${dateStr}</span>
                            </div>
                        </div>
                    </div>`;
                });
                grid.innerHTML = html;
            } catch(e) { grid.innerHTML = `<div style="grid-column: 1 / -1; color:red; text-align:center;">Error loading articles.</div>`; }
        }

        function openArticle(id) {
            db.collection("articles").doc(id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
            window.location.href = `read.html?id=${id}`;
        }

        // 🟢 NEW: LIVE SEARCH LOGIC
        function filterArticles() {
            let filter = document.getElementById('article-live-search').value.toLowerCase();
            let cards = document.querySelectorAll('.article-card');
            
            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                if (text.includes(filter)) {
                    card.style.display = 'flex'; // Uses flex because of your CSS
                } else {
                    card.style.display = 'none';
                }
            });
        }

        loadArticles();
    </script>
</body>
</html>
