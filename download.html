   <script>
    // 1. APNA ASLI SMART LINK (DIRECT LINK) YAHAN DALEIN
    // Adsterra dashboard -> Direct Links -> Copy URL
    const SMART_LINK = "https://www.profitablecpmratenetwork.com/cait9i7tau?key=22a393a6ed9f96dab738f8c32500f680"; 

    const COUNTDOWN_TIME = 15;

    // URL se file link nikalna
    const urlParams = new URLSearchParams(window.location.search);
    const actualFileUrl = urlParams.get('file');

    // Debugging ke liye: Console mein check karein agar link aa raha hai
    console.log("File to download:", actualFileUrl);

    if (!actualFileUrl) {
        document.body.innerHTML = "<div class='flex items-center justify-center h-screen font-bold text-red-500 text-xl'>Error: File link missing! Go back and try again.</div>";
    }

    let timeLeft = COUNTDOWN_TIME;
    const timerText = document.getElementById('timer-text');
    const progressBar = document.getElementById('progress-bar');
    const downloadBtn = document.getElementById('download-btn');
    const statusText = document.getElementById('status-text');
    const timerWrapper = document.getElementById('timer-wrapper');

    const countdown = setInterval(() => {
        timeLeft--;
        timerText.innerText = timeLeft;
        const offset = 251.2 - (251.2 * (COUNTDOWN_TIME - timeLeft)) / COUNTDOWN_TIME;
        progressBar.style.strokeDashoffset = offset;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerWrapper.classList.add('hidden');
            statusText.innerText = "Your link is ready!";
            statusText.classList.replace('text-orange-500', 'text-green-600');
            downloadBtn.classList.remove('hidden');
        }
    }, 1000);

    // FIX: Sahi tarika click handle karne ka
    // Clean and Direct Download Logic (No Smartlink, No Redirects)
    downloadBtn.addEventListener('click', (e) => {
        e.preventDefault();

        const finalFileUrl = decodeURIComponent(actualFileUrl);
        
        // Button click karte hi seedha notes usi tab mein khul jayenge
        window.location.href = finalFileUrl;

        // Note: Agar aap chahte hain ki notes naye tab mein khulein 
        // toh upar wali line ko hata kar niche wali line use karein:
        // window.open(finalFileUrl, '_blank');
    });
</script>
