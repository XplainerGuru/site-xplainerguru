<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Live Exam | Xplainer Guru</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="m-0 p-0 font-['Manrope'] bg-slate-50 text-slate-900 overflow-x-hidden select-none">

    <div class="fixed inset-0 w-screen h-screen pointer-events-none z-[9999] flex justify-center items-center opacity-5 text-[8vw] font-['Poppins'] font-extrabold text-slate-900 -rotate-[30deg] whitespace-nowrap text-center leading-tight" id="watermark-text">
        XPLAINER GURU<br>Loading ID...
    </div>

    <div id="loader-ui" class="fixed inset-0 bg-white z-[99999] flex flex-col justify-center items-center">
        <div class="w-full flex justify-center mb-10 min-h-[50px] absolute top-10 z-[100000]">
            <div id="at-320x50"></div>
        </div>

        <script type="text/javascript">
            atOptions = { 'key' : '1a4e90822d236b74e172b42322f602f7', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            const bannerScript = document.createElement('script');
            bannerScript.type = "text/javascript";
            bannerScript.src = "https://www.highperformanceformat.com/1a4e90822d236b74e172b42322f602f7/invoke.js";
            bannerScript.onerror = () => console.error("320x50 Banner blocked by Ad-Blocker");
            document.getElementById('at-320x50').appendChild(bannerScript);
        </script>

        <i class="fa-solid fa-shield-halved fa-spin fa-2x text-blue-600 mb-[15px]"></i>
        <h2 class="font-['Poppins'] text-slate-900 m-0 text-2xl">Securing Exam Environment...</h2>
        <p class="text-slate-500 font-semibold mt-2">Do not switch tabs or refresh.</p>
    </div>

    <div id="exam-ui" class="hidden">
        
        <div class="bg-slate-900 text-white py-3.5 px-5 flex justify-between items-center sticky top-0 z-[100] shadow-[0_4px_15px_rgba(0,0,0,0.1)]">
            <h2 class="font-['Poppins'] text-[16px] sm:text-[18px] m-0 leading-tight" id="test-title-display">Loading Test...</h2>
            <div class="bg-red-500 py-2 px-4 sm:px-5 rounded-full font-mono font-extrabold text-[16px] sm:text-[20px] tracking-[2px] shadow-[0_0_15px_rgba(239,68,68,0.4)]" id="timer-display">--:--:--</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-[1fr_320px] max-w-[1400px] mx-auto min-h-[calc(100vh-70px)]">
            
            <div class="p-5 sm:p-10 bg-white border-b md:border-b-0 md:border-r border-slate-200 flex flex-col z-10 relative">
                <div class="font-extrabold text-blue-600 text-[14px] mb-[15px] uppercase tracking-wide" id="q-num-display">Question 1</div>
                <div class="text-[18px] sm:text-[20px] font-semibold mb-[25px] leading-relaxed text-slate-800" id="q-text-display">Fetching question from secure server...</div>

                <img id="q-image-display" class="max-w-full max-h-[300px] rounded-lg mb-[25px] border border-slate-200 object-contain hidden" src="" alt="Question Diagram">

                <div class="flex flex-col gap-[15px] mb-10" id="options-container">
                    </div>

                <div class="mt-auto flex flex-col sm:flex-row justify-between pt-5 border-t border-slate-200 gap-4">
                    <div class="flex gap-2.5 w-full sm:w-auto">
                        <button class="flex-1 sm:flex-none px-4 sm:px-[25px] py-3 rounded-lg font-extrabold border-none cursor-pointer font-['Manrope'] transition duration-200 text-[14px] sm:text-[15px] bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center gap-2" onclick="prevQuestion()"><i class="fa-solid fa-arrow-left"></i> Previous</button>
                        <button class="flex-1 sm:flex-none px-4 sm:px-[25px] py-3 rounded-lg font-extrabold border bg-white border-red-200 text-red-500 cursor-pointer font-['Manrope'] transition duration-200 text-[14px] sm:text-[15px] hover:bg-red-50 flex items-center justify-center gap-2" onclick="clearResponse()"><i class="fa-solid fa-eraser"></i> Clear</button>
                    </div>
                    <div class="flex gap-2.5 w-full sm:w-auto">
                        <button class="flex-1 sm:flex-none px-4 sm:px-[25px] py-3 rounded-lg font-extrabold border-none cursor-pointer font-['Manrope'] transition duration-200 text-[14px] sm:text-[15px] bg-violet-500 text-white hover:bg-violet-600 flex items-center justify-center gap-2" onclick="markForReview()"><i class="fa-solid fa-flag"></i> Mark Review</button>
                        <button class="flex-1 sm:flex-none px-4 sm:px-[25px] py-3 rounded-lg font-extrabold border-none cursor-pointer font-['Manrope'] transition duration-200 text-[14px] sm:text-[15px] bg-blue-600 text-white hover:bg-blue-700 flex items-center justify-center gap-2 shadow-md" onclick="nextQuestion()">Save & Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-5 sm:p-[25px] flex flex-col z-10 relative">
                <h3 class="font-['Poppins'] m-0 mb-5 text-[16px] text-slate-900">Question Palette</h3>

                <div class="grid grid-cols-5 gap-[10px] mb-[30px]" id="palette-container">
                    </div>

                <div class="bg-white p-[15px] rounded-lg border border-slate-200 mb-[20px] text-[12px] font-bold text-slate-600">
                    <div class="flex items-center gap-2.5 mb-2"><span class="w-3 h-3 bg-emerald-500 rounded-full"></span> Answered</div>
                    <div class="flex items-center gap-2.5 mb-2"><span class="w-3 h-3 bg-red-500 rounded-full"></span> Not Answered</div>
                    <div class="flex items-center gap-2.5 mb-2"><span class="w-3 h-3 bg-violet-500 rounded-full"></span> Marked for Review</div>
                    <div class="flex items-center gap-2.5"><span class="w-3 h-3 bg-white border-2 border-slate-300 rounded-full box-border"></span> Not Visited</div>
                </div>

                <button class="bg-green-600 hover:bg-green-700 text-white border-none p-[15px] rounded-lg font-extrabold cursor-pointer w-full text-[16px] font-['Manrope'] mt-auto transition duration-200 shadow-lg" onclick="forceSubmit('User clicked Submit Test')"><i class="fa-solid fa-paper-plane mr-2"></i> Submit Test</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <script>
        let currentUserData = null;
        let testId = new URLSearchParams(window.location.search).get("id");
        let testData = null;
        let isTestActive = false;

        let currentQuestionIndex = 0;
        let userResponses = [];

        let totalTimeSpent = 0;
        let questionTimerInterval = null;
        let globalTimerInterval = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                localStorage.setItem("redirectAfterLogin", `exam.html?id=${testId}`);
                window.location.href = "login.html";
                return;
            }
            try {
                const doc = await firebase.firestore().collection("users").doc(user.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                    document.getElementById('watermark-text').innerHTML = `XPLAINER GURU<br>${currentUserData.name.toUpperCase()}<br>${user.uid.substring(0, 8)}`;
                    fetchTestFromDatabase(); 
                }
            } catch (e) {
                alert("Authentication error. Please login again.");
                window.location.href = "login.html";
            }
        });

        async function fetchTestFromDatabase() {
            if (!testId) {
                alert("Invalid Test Link!");
                window.location.href = "tests.html";
                return;
            }

            try {
                const doc = await firebase.firestore().collection('mock_tests').doc(testId).get();
                if (doc.exists) {
                    testData = doc.data();

                    testData.questions.forEach((q, index) => {
                        userResponses.push({
                            qIndex: index,
                            status: 'not-visited',
                            selected: null,
                            timeSpent: 0
                        });
                    });

                    document.getElementById('loader-ui').style.display = 'none';
                    document.getElementById('exam-ui').classList.remove('hidden');
                    document.getElementById('exam-ui').style.display = 'block';
                    document.getElementById('test-title-display').innerText = testData.title;

                    isTestActive = true;
                    startGlobalTimer(testData.duration || 0);
                    loadQuestion(0);
                    
                    document.addEventListener('contextmenu', e => e.preventDefault());
                    document.addEventListener('copy', e => e.preventDefault());

                } else {
                    alert("Test not found or has been removed.");
                    window.location.href = "tests.html";
                }
            } catch (error) {
                console.error(error);
                alert("Failed to load the test. Please check your connection.");
            }
        }

        function loadQuestion(index) {
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            currentQuestionIndex = index;
            const q = testData.questions[index];

            if (userResponses[index].status === 'not-visited') {
                userResponses[index].status = 'not-ans';
            }

            document.getElementById('q-num-display').innerText = `Question ${index + 1} of ${testData.questions.length}`;
            document.getElementById('q-text-display').innerText = q.text;

            const imgEl = document.getElementById('q-image-display');
            if (q.image) {
                imgEl.src = q.image;
                imgEl.classList.remove('hidden');
                imgEl.style.display = 'block';
            } else {
                imgEl.classList.add('hidden');
                imgEl.style.display = 'none';
            }

            let optionsHTML = "";
            const opts = ['A', 'B', 'C', 'D'];
            opts.forEach(optKey => {
                const isChecked = userResponses[index].selected === optKey ? "checked" : "";
                
                optionsHTML += `
                    <div class="relative">
                        <input type="radio" name="q_option" id="opt_${optKey}" value="${optKey}" ${isChecked} onchange="saveAnswer('${optKey}')" class="peer hidden">
                        <label for="opt_${optKey}" class="flex items-center p-[15px_20px] border-2 border-slate-200 rounded-xl cursor-pointer font-semibold transition duration-200 text-[16px] text-slate-700 hover:bg-slate-50 hover:border-slate-300 peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-checked:text-blue-700 [&>.checked-icon]:hidden peer-checked:[&>.checked-icon]:inline-block peer-checked:[&>.unchecked-icon]:hidden">
                            <i class="fa-regular fa-circle text-slate-300 mr-3 text-[18px] unchecked-icon"></i>
                            <i class="fa-solid fa-circle-check text-blue-600 mr-3 text-[18px] checked-icon"></i>
                            ${optKey}. ${q.options[optKey]}
                        </label>
                    </div>
                `;
            });
            document.getElementById('options-container').innerHTML = optionsHTML;

            renderPalette();

            questionTimerInterval = setInterval(() => {
                if (isTestActive) {
                    userResponses[currentQuestionIndex].timeSpent++;
                }
            }, 1000);
        }

        function saveAnswer(optKey) {
            userResponses[currentQuestionIndex].selected = optKey;
            userResponses[currentQuestionIndex].status = 'ans';
            renderPalette();
        }

        function clearResponse() {
            userResponses[currentQuestionIndex].selected = null;
            userResponses[currentQuestionIndex].status = 'not-ans';
            const radios = document.getElementsByName('q_option');
            radios.forEach(r => r.checked = false);
            renderPalette();
        }

        function markForReview() {
            userResponses[currentQuestionIndex].status = 'rev';
            renderPalette();
            nextQuestion(); 
        }

        function nextQuestion() {
            if (currentQuestionIndex < testData.questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                alert("You have reached the last question. Please review the palette and click 'Submit Test' when you are ready.");
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function jumpToQuestion(index) {
            loadQuestion(index);
        }

        // 5. PALETTE RENDERER (TAILWIND DYNAMIC INJECTION)
        function renderPalette() {
            let paletteHTML = "";
            userResponses.forEach((res, i) => {
                let currClass = (i === currentQuestionIndex) ? "!border-slate-900 !border-[3px] scale-110 shadow-md" : "";
                let statusClass = "";
                
                if(res.status === 'ans') statusClass = "!bg-emerald-500 !text-white !border-emerald-500";
                else if(res.status === 'not-ans') statusClass = "!bg-red-500 !text-white !border-red-500";
                else if(res.status === 'rev') statusClass = "!bg-violet-500 !text-white !border-violet-500";

                paletteHTML += `<button class="aspect-square rounded-full border-2 border-slate-300 bg-white font-extrabold cursor-pointer text-[14px] text-slate-600 transition duration-200 flex justify-center items-center p-0 hover:bg-slate-100 ${statusClass} ${currClass}" onclick="jumpToQuestion(${i})">${i + 1}</button>`;
            });
            document.getElementById('palette-container').innerHTML = paletteHTML;
        }

        // 6. TIMER LOGIC
        function startGlobalTimer(minutes) {
            let timeRemaining = minutes * 60;
            let isCountUp = (minutes === 0);
            let display = document.getElementById('timer-display');

            globalTimerInterval = setInterval(() => {
                if (!isTestActive) return;

                totalTimeSpent++; 

                if (isCountUp) {
                    timeRemaining++;
                } else {
                    timeRemaining--;
                    if (timeRemaining <= 0) forceSubmit("Time Limit Exceeded");
                }

                let hrs = Math.floor(timeRemaining / 3600);
                let mins = Math.floor((timeRemaining % 3600) / 60);
                let secs = timeRemaining % 60;

                display.innerText = `${hrs > 0 ? (hrs < 10 ? "0" + hrs + ":" : hrs + ":") : ""}${mins < 10 ? "0" + mins : mins}:${secs < 10 ? "0" + secs : secs}`;
            }, 1000);
        }

        // 7. FINAL SUBMISSION LOGIC 
        function forceSubmit(reason) {
            if (!isTestActive) return;
            
            if (reason === "User clicked Submit Test") {
                const confirmSubmit = confirm("Are you sure you want to submit the test? You cannot change your answers after this.");
                if(!confirmSubmit) return; 
            }

            isTestActive = false;
            clearInterval(questionTimerInterval);
            clearInterval(globalTimerInterval);

            let correctCount = 0;
            let wrongCount = 0;

            userResponses.forEach((res, i) => {
                if (res.selected) {
                    if (res.selected === testData.questions[i].correctAnswer) correctCount++;
                    else wrongCount++;
                }
            });

            const resultPayload = {
                testId: testId,
                attemptId: Date.now().toString(), 
                title: testData.title,
                totalQuestions: testData.questions.length,
                correct: correctCount,
                wrong: wrongCount,
                timeSpent: totalTimeSpent,
                responses: userResponses,
                originalTest: testData
            };

            sessionStorage.setItem('xg_temp_result', JSON.stringify(resultPayload));

            alert(`TEST SUBMITTED!\nRedirecting to your detailed Report Card...`);
            window.location.href = `result.html?id=${testId}`;
        }
    </script>
</body>
</html>
